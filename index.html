<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BurbenogInspired</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#141a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: Kriegstisch bei Nacht – Kopfleiste mit Tageszeit-Leiste, Spielfelder im Raster, Bauleiste unten fest */
:root{
  color-scheme: dark;
  --bg:#141a17; --panel:#1d2521; --line:#33403a; --fg:#e6e2d3; --muted:#9aa49c;
  --accent:#e0b04a; --danger:#e0604a; --ok:#7cc48a;
  --grass:#24301f; --grass2:#2a3824; --road:#5a4a35; --road2:#6b5940;
  --display:"Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:12px 150px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:2rem;margin:0;letter-spacing:.02em;color:var(--accent)}
h1 small{font-family:var(--body);font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.stats{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.bad b{color:var(--danger)}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.slot{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panel);font-size:.82rem;color:var(--muted);min-width:0}
.slot b{font-family:var(--mono);color:var(--fg);display:block;font-size:1rem}
.slot.now{border-color:var(--accent);color:var(--fg)}
.slot.done{opacity:.5}
.slot .wx{font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
.btn.primary{background:var(--accent);color:#1b1408;border-color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.45;cursor:default}
.btn.on{border-color:var(--accent);color:var(--accent)}
.muted{color:var(--muted);font-size:.85rem}
.spacer{flex:1}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--accent);color:#1b1408;font-weight:700;padding:8px 14px;border-radius:8px;box-shadow:0 4px 16px #0008;max-width:calc(100% - 32px)}
.research{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.research h2{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 6px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
.house{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.house b{font-family:var(--display);font-weight:600;font-size:1.05rem}
.ritem{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.85rem}
.ritem .btn{padding:4px 10px;font-size:.8rem;white-space:nowrap}
.done-r{color:var(--ok);font-size:.8rem}
.today{margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.today b{color:var(--fg)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:2px 4px 2px 0;font-family:var(--mono);font-size:.8rem}
.chip.good{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.seats select,.seats input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg)}
.seats{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.lanes{grid-template-columns:1fr}}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.lane.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:8px}
.lhead .name{font-weight:700;font-size:1.05rem}
.el{border:none;background:none;padding:0;font-weight:700}
.el[disabled]{cursor:default}
.meta{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--fg)}
.meta .plus{color:var(--ok)}
.inc{margin-left:auto;font-size:.82rem;color:var(--muted)}
canvas{display:block;width:100%;border-radius:4px;touch-action:manipulation}
.info{font-size:.85rem;color:var(--muted);min-height:1.3em;margin-top:6px}
.info button{margin-left:8px;padding:2px 8px;font-size:.8rem}
.log{margin-top:16px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.log h2{font-family:var(--display);font-weight:600;color:var(--fg);font-size:1.2rem;margin:0 0 6px}
.log ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.log li b{font-family:var(--mono);color:var(--fg);font-weight:500;margin-right:6px}
.palette{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.ptitle{max-width:1200px;margin:0 auto 6px;font-size:.82rem;color:var(--muted)}
.ptitle b{color:var(--fg)}
.prow{max-width:1200px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tw{flex:0 0 auto;width:132px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.tw .n{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.tw .n img{width:24px;height:24px;flex:0 0 auto}
.tw .c{font-family:var(--mono);font-size:.78rem;color:var(--accent)}
.tw .d{font-size:.72rem;color:var(--muted);line-height:1.2}
.tw.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tw[disabled]{opacity:.4;cursor:default}
.banner{margin-bottom:12px;padding:10px 14px;border-radius:6px;border:1px solid var(--accent);font-weight:500}
.banner.bad{border-color:var(--danger)}
.setup{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:560px}
.setup h2{font-family:var(--display);font-weight:600;margin:0;font-size:1.5rem}
.setup label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.setup select,.setup input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row>label{flex:1 1 160px}
/* Dialog im Vordergrund: Bauen bestätigen, Monster-Info, Sieg/Niederlage */
.dlgback{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:420px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 40px #000c;display:flex;flex-direction:column;gap:10px}
.dlg h2{font-family:var(--display);font-weight:600;font-size:1.5rem;margin:0;display:flex;align-items:center;gap:8px}
.dlg h2 img{width:40px;height:40px}
.dlgback.sheet{background:#0003;align-items:flex-start;padding-top:max(12px, env(safe-area-inset-top,0px))}
.dlgback.sheet .dlg{gap:8px;padding:12px 14px}
.dlgback.sheet dl{grid-template-columns:auto 1fr auto 1fr;font-size:.85rem}
.dlg .big{font-size:2.6rem;line-height:1}
.dlg.won{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 10px 40px #000c}
.dlg.lost{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger),0 10px 40px #000c}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.92rem}
.dlg dt{color:var(--muted)} .dlg dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat-t{width:100%;border-collapse:collapse;font-size:.85rem}
.stat-t th,.stat-t td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.stat-t th{color:var(--muted);font-weight:500}
.stat-t td{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ibtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:24px;height:24px;padding:0;font-size:.8rem;line-height:22px;margin-left:4px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>BurbenogInspired <small id="modeTag">verbinde …</small></h1>
    <div class="stats" id="stats" hidden>
      <div class="stat"><b id="sDay"></b><span>Tag</span></div>
      <div class="stat" id="passBox"><b id="sPass"></b><span>Ganz durchgebrochen</span></div>
      <div class="stat"><b id="sNext"></b><span id="sNextL">Nächste Welle</span></div>
    </div>
  </header>

  <section id="setup" class="setup" hidden>
    <h2>Neues Spiel</h2>
    <div class="row">
      <label for="fPlayers">Spieler<select id="fPlayers"><option>2</option><option>3</option><option selected>4</option></select></label>
      <label for="fTiming" id="lTiming">Wellen kommen<select id="fTiming">
        <option value="test">Test: alle paar Minuten</option>
        <option value="real">Echt: 10, 13, 16, 19 Uhr</option></select></label>
      <label for="fLive">Spielart<select id="fLive">
        <option value="0">Uhrzeiten: Leaks kommen zur nächsten Welle</option>
        <option value="1">Live: Leaks laufen sofort beim Nachbarn weiter</option></select></label>
    </div>
    <div class="row" id="rowTest"><label for="fInterval">Abstand zwischen Wellen (Minuten)<input id="fInterval" type="number" min="1" max="120" value="3"></label></div>
    <div class="row" id="rowReal" hidden><label for="fStart">Tag 1 ist<select id="fStart"><option value="0">heute</option><option value="1" selected>morgen</option></select></label></div>
    <p class="muted" id="setupHint" style="margin:0"></p>
    <div><button class="btn primary" id="fGo">Spiel starten</button></div>
  </section>

  <div id="game" hidden>
    <div class="clock" id="clock"></div>
    <div id="banner" class="banner" hidden></div>
    <div id="vbanner" class="banner bad" hidden></div>
    <div class="today" id="today"></div>
    <div class="seats" id="seats"></div>
    <div class="seats" id="gift"></div>
    <div class="controls">
      <button class="btn primary" id="ready" hidden></button>
      <button class="btn primary" id="go"></button>
      <button class="btn" id="replay">Letzte Welle ansehen</button>
      <span class="muted">Tempo</span>
      <button class="btn" data-speed="1">1×</button>
      <button class="btn" data-speed="3">3×</button>
      <button class="btn" data-speed="10">10×</button>
      <button class="btn" id="skip">Ende zeigen</button>
      <span class="spacer"></span>
      <button class="btn" id="reset">Neues Spiel</button>
    </div>
    <main class="lanes" id="lanes"></main>
    <section class="research" id="research"></section>
    <section class="log"><h2>Chronik</h2><ol id="log"></ol></section>
  </div>
</div>
<div id="pop" class="pop" hidden></div>
<div id="dlgback" class="dlgback" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="palette" id="palette" hidden>
  <div class="ptitle" id="ptitle"></div>
  <div class="prow" id="prow"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   ONLINE-SPEICHER (Firebase). Hier die Werte aus der Firebase-Konsole
   einfügen (Projekteinstellungen → Deine Apps → Web-App → firebaseConfig).
   Leer lassen = Ein-Gerät-Modus.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDqKXqGho_rQveqs7ltUR_vHykgGClgL1I",
  authDomain: "burbenoginspired.firebaseapp.com",
  projectId: "burbenoginspired",
  appId: "1:45840879921:web:f4f4f8bb60e49a091ae010"
};
const GAME_ID = "spiel1";   // anderer Name = eigenes, getrenntes Spiel
const VERSION = "2026-10-12m";  // bei JEDER Änderung hochzählen: alte Handys merken so, dass sie neu laden müssen

/* =====================================================================
   SPIELDATEN – Regeln und Zahlen. Alles hier darf geändert werden.
   */
const CONFIG = {
  days: 20,                 // Runden = Tage, jeden Tag ein neues Monster
  lossLimit: 30,            // mehr ganz durchgebrochene Monster = verloren
  startGold: 30,
  perWave: 20,              // Monster pro Welle (Boss: 1)
  /* Leben: baseHp × Runde^hpExp × hpMul × Spielerfaktor. Ausgelegt auf 40 Runden (Test: 20).
     Richtwert (11.10. nachts): Mit den Anfangstürmen schafft ein Spieler in den ersten Runden
     ca. 12 von 20 (2 Spieler), 8 (3 Spieler), 6 (4 Spieler). Kalibriert mit tools/kalibrieren.js. */
  baseHp: 14,               // 12.10.: neu kalibriert für 16 × 16
  playerHp: { 2:1, 3:1.25, 4:1.5 },
  hpExp: 1.5,               // Runde 2: ×2,8 · Runde 5: ×11 · Runde 10: ×32 · Runde 20: ×89 · Runde 40: ×253
  armorFrac: 0.004,         // Rüstung = 0,004 × (Runde − 1) × Grundleben der Runde (Runde 20: ca. 8 % der Leben)
  // Wellenzeiten je Spielerzahl: keine leeren Wellen, 19 Uhr (dunkel) ist immer dabei
  slotPlan: { 2:[10, 19], 3:[10, 16, 19], 4:[10, 13, 16, 19] },
  darkFrom: 19,             // ab 19 Uhr ist es dunkel: Schatten-Türme schießen nicht
  firstWaveDelay: 1,        // Testmodus: erste Welle erst nach 1 Minute
  maxLevel: 6,              // Stufe 1 + 5 Upgrades
  upgradeCost: 1.5,         // jedes Upgrade kostet 1,5 × so viel wie das vorige
  upgrade: { dmg:2.0, firstDmg:2.1, range:0.2, dur:1.3, eff:1.15 },  // erstes Upgrade (Stufe 1→2): Schaden ×2,1, danach je ×2
   // pro Upgrade: Schaden ×2, Reichweite +0,2, Effektdauer ×1,3, Effektstärke ×1,15
  giftFee: 0.10, giftStep: 10,
  weatherChange: 0.35,      // Chance, dass das Wetter vor einer Welle umschlägt
  spawnGap: 0.9,            // Sekunden zwischen zwei Monstern (früher 0,5: Flächenschaden war zu stark)
  immune: 0.5,              // Schadensfaktor bei weak = 0 (war 0,25)
  splashEdge: 0.7,          // Flächenschaden fällt nach außen ab: Mitte 100 %, Rand 70 % (11.10. abends: war 40 %)
  shotSpeed: 9, lobSpeed: 6.5,  // Geschosse in Feldern/s: gezielte fliegen dem Ziel nach, Flächen-Geschosse (Wurf) fliegen auf den Punkt, wo das Ziel beim Abschuss war
  stunMax: 5,               // Betäubung höchstens 5 s
  sellRefund: 0.5
};
const DAY = 'Tag';
// Gelände: Bauen kostet je nach Feld mehr. Stein zahlt keinen Aufschlag.
const TERRAIN = [
  { name:'Wiese', extra:0,  col:['#24301f','#2a3824'] },
  { name:'Wald',  extra:10, col:['#17271a','#1b2e1e'] },
  { name:'Sumpf', extra:20, col:['#25302f','#2b3735'] }
];
const TERRAIN_MAX = 26;     // Wald- und Sumpffelder je Karte bei 63 Feldern Weg, kürzerer Weg = etwas weniger
// Forschung: drei Gebäude, alle zahlen gemeinsam aus der Gemeinschaftskasse (ohne Gebühr)
const RESEARCH = [
  { id:'t5',   house:'Bauhütte',     name:'Türme 5–6 freischalten', cost:150 },
  { id:'t7',   house:'Bauhütte',     name:'Türme 7–8 freischalten', cost:600, need:'t5' },
  { id:'cheap',house:'Bauhütte',     name:'Upgrades 20 % billiger',  cost:250 },
  { id:'el0',  house:'Elementlabor', name:'Feuer +25 % Schaden',     cost:120, el:0 },
  { id:'el1',  house:'Elementlabor', name:'Eis +25 % Schaden',       cost:120, el:1 },
  { id:'el2',  house:'Elementlabor', name:'Schatten +25 % Schaden',  cost:120, el:2 },
  { id:'el3',  house:'Elementlabor', name:'Stein +25 % Schaden',     cost:120, el:3 },
  { id:'dur',  house:'Akademie',     name:'Effekte halten 30 % länger', cost:200 },
  { id:'rng',  house:'Akademie',     name:'Reichweite +0,3',         cost:200 },
  { id:'gold', house:'Akademie',     name:'Kopfgeld +20 %',          cost:300 }
];
const LOCKS = { 4:'t5', 5:'t5', 6:'t7', 7:'t7' };   // Turm-Index → nötige Forschung
/* Wetter: wechselt im Lauf des Tages (Chance je Welle: CONFIG.weatherChange). Stein ist wetterfest.
   el: je Element [Feuer, Eis, Schatten] → dmg = Schaden, eff = Effektstärke, dur = Effektdauer
   range = Reichweite aller Türme außer Stein, burnDecay = Brennen erlischt schneller, flySpeed = Fliegende schneller/langsamer */
const WEATHER = [
  { name:'Sonnig',   sym:'☀', w:3,   el:{ 0:{dmg:1.25, eff:1.25}, 1:{dur:0.7}, 2:{dmg:1.15} } },
  { name:'Bewölkt',  sym:'☁', w:3,   el:{ 1:{dur:1.15}, 2:{dmg:0.7, eff:0.8} } },
  { name:'Regen',    sym:'☂', w:2,   el:{ 0:{dmg:0.8, dur:0.4}, 1:{eff:1.25, dmg:1.1}, 2:{dmg:0.85} }, burnDecay:2.5 },
  { name:'Gewitter', sym:'ϟ', w:1,   el:{ 0:{dmg:0.8, dur:0.4}, 1:{eff:1.15}, 2:{dmg:0.6} }, burnDecay:2, flySpeed:0.7 },
  { name:'Nebel',    sym:'≡', w:1.5, el:{ 2:{dmg:1.3, eff:1.3} }, range:0.75 },
  { name:'Frost',    sym:'❄', w:1,   el:{ 0:{dmg:0.85}, 1:{eff:1.3, dur:1.5, dmg:1.1} } },
  { name:'Hitze',    sym:'♨', w:1,   el:{ 0:{dmg:1.5, eff:1.3}, 1:{eff:0.7, dur:0.5} } },
  { name:'Wind',     sym:'≋', w:1.5, el:{ 0:{dmg:0.9, eff:1.4} }, flySpeed:1.4 }
];          // Effektdauer „ganzer Tag“: hält über alle vier Wellen
// Kopfgeld je Monster, flach: Runde 1–5: 2, 6–10: 3, 11–15: 5, 16–20: 8, 21–25: 12, 26–30: 17, 31–35: 23, 36–40: 30
// 11.10.: insgesamt × 0,8 (gerundet), damit das Spiel nicht zu leicht wird
const BOUNTY = [2, 3, 5, 8, 12, 17, 23, 30];
function bountyFor(r){ return BOUNTY[Math.min(BOUNTY.length - 1, Math.floor((r - 1) / 5))]; }

// Turm 1–8: Preis und „Kraft“ (Gesamtschaden/s bei Anteil 1,0)
// Flache Baukurve (11.10. nachts): Turm 8 erreicht man in 20 Runden praktisch nicht, erst im 40-Runden-Spiel.
const TOWER_COST  = [10, 45, 70, 120, 200, 350, 650, 1200];
const TOWER_POWER = [2, 9.45, 15.4, 27.6, 47, 86, 166, 319];   // Kraft je Gold steigt leicht mit dem Preis
/* Jeder Turm: [Name, Rolle, Reichweite, Schüsse/s, Geschosse, Schadensanteil, Effektstärke, Effektdauer (s oder DAY), Fläche, Optionen]
   Rolle: Schaden · Effekt · Reichweite · Fläche · Luftabwehr · Licht (nur Anzeige)
   Effekt je Element:
     Feuer    Brennen: Stärke = Brennschaden als Anteil der Turmkraft, ignoriert Rüstung
     Eis      Verlangsamen: Stärke = Anteil (0,4 = 40 % langsamer), wirkt nicht auf Fliegende
     Schatten Fluch: Ziel nimmt +Stärke mehr Schaden von allen Türmen. Schatten-Geschosse ignorieren Rüstung.
     Stein    Betäuben (nur 2 Türme): Stärke = Sekunden Stillstand, wirkt nur mit „chance“ pro Treffer (fester Seed)
   Optionen (10. Feld):
     effect   anderer Effekt als das Element      rateUp  Feuerrate × Wert pro Upgrade
     fly      true/false: trifft Fliegende (Standard: ja, bei Stein nein)
     air      trifft NUR Fliegende (Luftabwehr)

const GRID = 2, COLS = 8 * GRID, ROWS = 8 * GRID;   // 16 × 16, quadratisch (12.10.)

const MAP_WPS = [

function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  for (let i = 0; i < wp.length - 1; i++) { const [ax,ay] = wp[i], [bx,by] = wp[i+1], l = Math.hypot(bx-ax, by-ay); seg.push({ax,ay,bx,by,len:l,start:len}); len += l; }
  const map = { k, wp, seg, len, cells:new Set(), terrain:[] };
  for (let d = 0; d < len; d += 0.1) { const [x,y] = posAt(map, d); const cx = Math.floor(x), cy = Math.floor(y); if (cx>=0&&cx<COLS&&cy>=0&&cy<ROWS) map.cells.add(cx+','+cy); }
  const r = rng(1000 + k * 77), cnt = Math.round(TERRAIN_MAX * len / 63), free = [];
  for (let y = 0; y < ROWS; y++) { map.terrain[y] = Array(COLS).fill(0); for (let x = 0; x < COLS; x++) if (!map.cells.has(x+','+y)) free.push([x,y]); }
  for (let j = free.length - 1; j > 0; j--) { const q = Math.floor(r() * (j + 1)); [free[j], free[q]] = [free[q], free[j]]; }
  free.slice(0, cnt).forEach(([x,y]) => map.terrain[y][x] = 1);
  free.slice(cnt, 2 * cnt).forEach(([x,y]) => map.terrain[y][x] = 2);

}
function posAt(map, d){

  const r = rng(Math.floor((g.cfg.startAt || 1) / 1000) + day * 7919), out = [pickWeather(r)];
  for (let k = 1; k < slotsOf(g).length; k++) out.push(r() < CONFIG.weatherChange ? pickWeather(r) : out[k-1]);

}

let MODE = null, DB = null, ME = null;

// Turmwerte aus Element, Turmnummer (idx 0–7) und Stufe (lvl 1–6)
function towerBase(el, idx){
  const E = ELEMENTS[el], [name, role, range, rate, shots, share, eff, dur, splash, opt = {}] = E.towers[idx];
  const cost = (E.costOverride && E.costOverride[idx]) || TOWER_COST[idx];
  return { name, role, cost, range: range * GRID, rate, shots, dps: TOWER_POWER[idx] * share, eff, dur, splash: (splash || 0) * GRID,
    effect:opt.effect || E.effect, rateUp:opt.rateUp || 1, pierce:!!E.pierce, dayOnly:!!E.dayOnly,
    hitsFly: opt.fly !== undefined ? opt.fly : !E.noFly, air:!!opt.air, slowFly:!!opt.slowFly, nova:!!opt.nova, light:(opt.light || 0) * GRID,
    chance:opt.chance || 0, chanceUp:opt.chanceUp || 0, chanceMax:opt.chanceMax || 0.4, idx, el };
}
function tdef(tw){
  const b = towerBase(tw.el, tw.idx), n = (tw.lvl || 1) - 1, U = CONFIG.upgrade;
  const dpsNow = b.dps * (n ? U.firstDmg * Math.pow(U.dmg, n - 1) : 1);
  let eff = b.eff * Math.pow(U.eff, n);
  if (b.effect === 'slow') eff = Math.min(0.85, eff);
  if (b.effect === 'curse') eff = Math.min(1.5, eff);
  if (b.effect === 'stun') eff = Math.min(CONFIG.stunMax, eff);
  const rate = b.rate * Math.pow(b.rateUp, n);
  return { ...b, lvl:n + 1, rate, dpsNow, dmg: dpsNow / rate / b.shots, eff,
    chance: b.chance ? Math.min(b.chanceMax, b.chance + b.chanceUp * n) : 0, light: b.light ? b.light + U.range * GRID * n : 0,
    dur: b.dur === DAY ? DAY : b.dur * Math.pow(U.dur, n), range: b.range + U.range * GRID * n };
}
const upgradeCost = tw => Math.round(towerBase(tw.el, tw.idx).cost * Math.pow(CONFIG.upgradeCost, tw.lvl || 1) * (curRes().has('cheap') ? 0.8 : 1));
const hpBase = r => CONFIG.baseHp * Math.pow(r, CONFIG.hpExp);
function monsterDef(type, players){ const M = MONSTERS[type], r = M.round;
  return { ...M, hp: hpBase(r) * M.hpMul * (CONFIG.playerHp[players || 2] || 1),
    armor: CONFIG.armorFrac * (r - 1) * hpBase(r), bounty: bountyFor(r) }; }
const fmtFactor = f => f === 0 ? '×' + String(CONFIG.immune).replace('.', ',') + ' · brennt nicht' : '×' + String(f).replace('.', ',');

/* ---------- Simulation (deterministisch) ----------
   Einziger Zufall: Betäubungschance, gewürfelt mit festem Seed (Spielstart, Tag, Welle, Spieler) –
   Auswertung und Wiedergabe kommen auf allen Handys zum selben Ergebnis.
   Effekte (fx) und Leben wandern mit den Leaks zum nächsten Spieler. Dauer DAY = bis Tagesende. */
const FOREVER = 1e6, DT = 1/30;
// Leuchtet ein Irrlicht (gleiches Feld) auf diesen Turm? Dann keine Dunkelheit und kein Wettermalus für Schatten.
function isLit(tw, towers){
  return towers.some(o => { if (o.el !== tw.el) return false; const L = tdef(o).light; return L && Math.hypot(o.x - tw.x, o.y - tw.y) <= L + 1e-6; });
}
function makeSim(inp){
  const res = new Set(inp.res || []), W = WEATHER[inp.weather || 0], raw = inp.towers || [];
  const towers = raw.map(tw => ({ ...tw, cd:0, def: wdef(tdef(tw), W, res) }));
  // Lichtkreise der Irrlichter: Im Dunkeln treffen Schatten-Türme nur Monster, die gerade darin sind
  const lights = towers.filter(t => t.def.light).map(t => ({ x:t.x + .5, y:t.y + .5, r:t.def.light }));
  return { towers, dark:!!inp.dark, players:inp.players || 2, res, map:MAPS[inp.lane || 0], W, rand:rng(inp.seed || 1),
    queue:(inp.incoming || []).map(s => JSON.parse(JSON.stringify(s))), lights, monsters:[], shots:[], fx:[], leaked:[], earned:0, kills:0, spawnT:0, t:0 };
}
const simBusy = s => s.queue.length || s.monsters.length || s.shots.length;
function wdef(def, W, res){          // Turmwerte mit Forschung und unter dem aktuellen Wetter
  let d = { ...def };
  if (res) {
    if (res.has('el' + def.el)) { d.dpsNow *= 1.25; d.dmg *= 1.25; }
    if (res.has('dur') && d.dur !== DAY) d.dur *= 1.3;
    if (res.has('rng')) d.range += 0.3 * GRID;
  }
  if (!W || ELEMENTS[def.el].weatherproof) return d;
  const e = W.el[def.el] || {}, ok = v => v;
  if (e.dmg) { d.dpsNow *= ok(e.dmg); d.dmg *= ok(e.dmg); }
  if (e.eff) { d.eff *= ok(e.eff); if (d.effect === 'slow') d.eff = Math.min(0.85, d.eff); }
  if (e.dur && d.dur !== DAY) d.dur *= ok(e.dur);
  if (W.range) d.range *= ok(W.range);
  return d;
}
function kill(s, m){ m.dead = true; s.earned += Math.round(m.def.bounty * (s.res.has('gold') ? 1.2 : 1)); s.kills++; }
function addFx(m, kind, val, t){           // stärkerer Wert gewinnt, längere Dauer gewinnt
  if (!(val > 0) || !(t > 0)) return;
  const c = m.fx[kind];
  if (!c || c.t <= 0) m.fx[kind] = { v:val, t };
  else { c.v = Math.max(c.v, val); c.t = Math.max(c.t, t); }
}
function hit(s, m, def, dmg){
  if (m.dead) return;
  const w = m.def.weak[def.el], f = w || CONFIG.immune;       // „immun“ = weniger Schaden und kein Brennen
  const vuln = 1 + (m.fx.curse && m.fx.curse.t > 0 ? m.fx.curse.v : 0);
  const armor = def.pierce ? 0 : m.def.armor;
  const raw = dmg * f * vuln;
  m.hp -= Math.max(raw * 0.2, raw - armor);
  const t = def.dur === DAY ? FOREVER : def.dur;
  if (def.effect === 'burn' && w) addFx(m, 'burn', def.eff * def.dpsNow / def.shots * f, t);
  if (def.effect === 'slow' && (!m.def.fly || def.slowFly)) addFx(m, 'slow', Math.min(0.85, def.eff * f), t);
  if (def.effect === 'curse') addFx(m, 'curse', def.eff * f, t);
  if (def.effect === 'stun' && def.eff > 0 && (!def.chance || s.rand() < def.chance)) addFx(m, 'stun', 1, Math.min(CONFIG.stunMax, def.eff * f));

function spawn(s, sp){
  const d = monsterDef(sp.type, s.players), [x,y] = posAt(s.map, 0);
  s.monsters.push({ id:s.t + s.monsters.length * .37, type:sp.type, def:d, hp: sp.hp > 0 ? sp.hp : d.hp, d:0, x, y, fx: sp.fx || {}, hops:sp.hops });
}
/* Welt = alle Felder einer Welle, im selben Takt. „Live“: Wer durchkommt, taucht sofort beim nächsten Spieler auf
   (behält Leben und Effekte). Sonst wandern die Leaks erst zur nächsten Wellenzeit. */
function makeWorld(run){ const sims = run.inputs.map(makeSim); sims.forEach(s => s.sent = 0); return { sims, live:!!run.live, n:run.inputs.length }; }
const worldBusy = w => w.sims.some(simBusy);
function stepWorld(w, dt){
  w.sims.forEach(s => step(s, dt));

function simulateWorld(run){ const w = makeWorld(run); let g = 0; while (worldBusy(w) && g++ < 600000) stepWorld(w, DT); return w; }

function step(s, dt){

  if (s.queue.length && s.queue[0].at !== undefined) { while (s.queue.length && s.queue[0].at <= s.t) spawn(s, s.queue.shift()); }
  else if (s.queue.length) { s.spawnT -= dt; if (s.spawnT <= 0) { spawn(s, s.queue.shift()); s.spawnT = CONFIG.spawnGap; } }
  for (const m of s.monsters) {
    if (m.dead) continue;
    for (const k in m.fx) m.fx[k].t -= dt * (k === 'burn' && s.W.burnDecay ? s.W.burnDecay : 1);
    const fx = m.fx, on = k => fx[k] && fx[k].t > 0;
    if (on('burn')) m.hp -= fx.burn.v * (1 + (on('curse') ? fx.curse.v : 0)) * dt;

    m.d += GRID * m.def.speed * (m.def.fly && s.W.flySpeed ? s.W.flySpeed : 1) * (1 - slow) * dt;

function resolveSlot(g, lanes){

  const inputs = [...Array(n)].map((_,i) => { const l = lanes[i] && lanes[i].gid === gidOf(g) ? lanes[i] : { el:i % ELEMENTS.length, towers:[] };
    return { lane:i, players:n, res:[...resAll], el:l.el, towers:l.towers || [], incoming:incomingFor(g, i), dark:isDark(SL[g.slot]), weather,

  resolving = true;

    const advance = g => { let n = 0;

}

/* ---------- Wiedergabe der letzten Welle ---------- */

  requestAnimationFrame(loop);

const dot = (c, x, y, r, col) => { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill(); };

let cssCache = null;

const BG = [];
function drawAll(){ if (G) for (let i = 0; i < NP(); i++) draw(i, $('cv'+i)); }
function draw(i, cv){
  if (!cv) return;

  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); const map = MAPS[i], v = cssVar;
  const s = replay && replay.sims[i], time = s ? s.t : 0;
  c.fillStyle = v('--bg'); c.fillRect(0, 0, W, H);
  const quake = s && s.fx.find(f => f.kind === 'quake');   // Erdbeben: das ganze Feld wackelt
  if (quake) { const a = (quake.t / quake.t0) * cs * .06; c.translate(Math.sin(time * 90) * a, Math.cos(time * 77) * a); }
  // Hintergrund (Boden, Weg, Gelände) nur einmal zeichnen und zwischenspeichern – spart auf dem Handy viel Zeit

  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) {
    const road = map.cells.has(x+','+y), T = TERRAIN[map.terrain[y][x]];
    g.fillStyle = road ? ((x+y)%2 ? v('--road') : v('--road2')) : T.col[(x+y)%2];
    g.fillRect(x*cs, y*cs, cs+.5, cs+.5);
  }
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) {
    if (map.cells.has(x+','+y)) continue; const t = map.terrain[y][x], h = (x*7 + y*13 + i*5) % 4;
    if (t === 1) { if (!spr(g, tinted('tree', '#5d7a52'), (x+.5)*cs, (y+.5)*cs, cs*.95, h*.4, .9)) { g.font = `${cs*.55}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.globalAlpha = .55; g.fillText('🌲', (x+.5)*cs, (y+.5)*cs); g.globalAlpha = 1; } }
    if (t === 2) { g.fillStyle = '#31504c'; g.beginPath(); g.ellipse((x+.45)*cs, (y+.55)*cs, cs*.32, cs*.18, h*.3, 0, Math.PI*2); g.fill();
      if (!spr(g, tinted('bush', '#6f8a66'), (x+.72)*cs, (y+.3)*cs, cs*.38, h, .7)) { g.strokeStyle = '#4a6260'; g.lineWidth = 1; for (const dy of [.35,.65]) { g.beginPath(); g.moveTo((x+.2)*cs, (y+dy)*cs); g.lineTo((x+.8)*cs, (y+dy)*cs); g.stroke(); } } }

// Turm-Symbol für die Bauleiste

/* ---------- Start ---------- */
async function newGame(){
  const players = +$('fPlayers').value, timing = MODE === 'online' ? $('fTiming').value : 'manual';
  const cfg = { players, timing, interval: Math.max(1, +$('fInterval').value || 3), startAt: Date.now(), live: $('fLive').value === '1', startGold: CONFIG.startGold, version: VERSION };
  cfg.slots = cfg.live ? [10] : CONFIG.slotPlan[players];   // Live: eine Welle am Tag, alles läuft ineinander
  if (timing === 'real') { const d = new Date(); d.setDate(d.getDate() + (+$('fStart').value)); d.setHours(0,0,0,0); cfg.day1 = d.getTime(); }

  render();
}
function onGame(g){
  const prevPlayers = G && G.cfg.players;
  G = g;
  if (!G) { lanesBuilt = 0; render(); return; }
  if (seat >= NP()) seat = 0;
  if (prevPlayers !== G.cfg.players) lanesBuilt = 0;
  if (G.lastRun && G.lastRun.id !== seenRun && !replay) { if (seenRun) startReplay(G.lastRun); else { seenRun = G.lastRun.id; lsSet('ww2-seen', seenRun); } }
  render();
}

$('fGo').onclick = newGame;

$('ready').onclick = toggleReady;
$('replay').onclick = () => G && startReplay(G.lastRun, true);

document.querySelectorAll('[data-speed]').forEach(x => x.onclick = () => { speed = +x.dataset.speed; render(); });
$('reset').onclick = () => {
  const r = $('reset');
  if (!r.dataset.confirm) { r.dataset.confirm = 1; r.textContent = 'Wirklich? Nochmal tippen'; setTimeout(() => { delete r.dataset.confirm; r.textContent = 'Neues Spiel'; }, 3000); return; }

  if (s && s.G) { L = s.L || []; seenRun = s.G.lastRun && s.G.lastRun.id; onGame(s.G); } else render();

async function startOnline(db){
