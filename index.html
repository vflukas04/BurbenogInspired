<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BurbenogInspired</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#141a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: Kriegstisch bei Nacht – Kopfleiste mit Tageszeit-Leiste, Spielfelder im Raster, Bauleiste unten fest */
:root{
  color-scheme: dark;
  --bg:#141a17; --panel:#1d2521; --line:#33403a; --fg:#e6e2d3; --muted:#9aa49c;
  --accent:#e0b04a; --danger:#e0604a; --ok:#7cc48a;
  --grass:#24301f; --grass2:#2a3824; --road:#5a4a35; --road2:#6b5940;
  --display:"Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:12px 150px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:2rem;margin:0;letter-spacing:.02em;color:var(--accent)}
h1 small{font-family:var(--body);font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.stats{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.bad b{color:var(--danger)}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.slot{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panel);font-size:.82rem;color:var(--muted);min-width:0}
.slot b{font-family:var(--mono);color:var(--fg);display:block;font-size:1rem}
.slot.now{border-color:var(--accent);color:var(--fg)}
.slot.done{opacity:.5}
.slot .wx{font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
.btn.primary{background:var(--accent);color:#1b1408;border-color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.45;cursor:default}
.btn.on{border-color:var(--accent);color:var(--accent)}
.muted{color:var(--muted);font-size:.85rem}
.spacer{flex:1}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--accent);color:#1b1408;font-weight:700;padding:8px 14px;border-radius:8px;box-shadow:0 4px 16px #0008;max-width:calc(100% - 32px)}
.research{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.research h2{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 6px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
.house{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.house b{font-family:var(--display);font-weight:600;font-size:1.05rem}
.ritem{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.85rem}
.ritem .btn{padding:4px 10px;font-size:.8rem;white-space:nowrap}
.done-r{color:var(--ok);font-size:.8rem}
.today{margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.today b{color:var(--fg)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:2px 4px 2px 0;font-family:var(--mono);font-size:.8rem}
.chip.good{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.seats select,.seats input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg)}
.seats{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.lanes{grid-template-columns:1fr}}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.lane.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:8px}
.lhead .name{font-weight:700;font-size:1.05rem}
.el{border:none;background:none;padding:0;font-weight:700}
.el[disabled]{cursor:default}
.meta{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--fg)}
.meta .plus{color:var(--ok)}
.meta.sub{flex-basis:100%;font-size:.7rem;margin-top:-4px}
.inc{margin-left:auto;font-size:.82rem;color:var(--muted)}
canvas{display:block;width:100%;border-radius:4px;touch-action:manipulation}
.info{font-size:.85rem;color:var(--muted);min-height:1.3em;margin-top:6px}
.info button{margin-left:8px;padding:2px 8px;font-size:.8rem}
.cvw{position:relative}
.tbar{position:absolute;display:flex;gap:6px;transform:translate(-50%,-100%);margin-top:-6px;z-index:5;pointer-events:none}
.tbar.below{transform:translate(-50%,0);margin-top:6px}
.tbar button{pointer-events:auto;display:flex;flex-direction:column;align-items:center;min-width:44px;padding:3px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:.7rem;line-height:1.1;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer}
.tbar button b{font-size:1.25rem;line-height:1}
.tbar .tup b{color:#e5483b}
.tbar button:disabled{opacity:.4}
.log{margin-top:16px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.log h2{font-family:var(--display);font-weight:600;color:var(--fg);font-size:1.2rem;margin:0 0 6px}
.log ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.log li b{font-family:var(--mono);color:var(--fg);font-weight:500;margin-right:6px}
.palette{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.ptitle{max-width:1200px;margin:0 auto 6px;font-size:.82rem;color:var(--muted)}
.ptitle b{color:var(--fg)}
.prow{max-width:1200px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tw{flex:0 0 auto;width:132px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.tw .n{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.tw .n img{width:30px;height:30px;flex:0 0 auto}
.tw .c{font-family:var(--mono);font-size:.78rem;color:var(--accent)}
.tw .d{font-size:.72rem;color:var(--muted);line-height:1.2}
.tw.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tw[disabled]{opacity:.4;cursor:default}
.banner{margin-bottom:12px;padding:10px 14px;border-radius:6px;border:1px solid var(--accent);font-weight:500}
.banner.bad{border-color:var(--danger)}
.setup{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:560px}
.setup h2{font-family:var(--display);font-weight:600;margin:0;font-size:1.5rem}
.setup label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.setup select,.setup input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row>label{flex:1 1 160px}
/* Dialog im Vordergrund: Bauen bestätigen, Monster-Info, Sieg/Niederlage */
.dlgback{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:420px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 40px #000c;display:flex;flex-direction:column;gap:10px}
.dlg h2{font-family:var(--display);font-weight:600;font-size:1.5rem;margin:0;display:flex;align-items:center;gap:8px}
.dlg h2 img{width:40px;height:40px}
.dlgback.sheet{background:#0003;align-items:flex-start;padding-top:max(12px, env(safe-area-inset-top,0px))}
.dlgback.sheet .dlg{gap:8px;padding:12px 14px}
.dlgback.sheet dl{grid-template-columns:auto 1fr auto 1fr;font-size:.85rem}
.dlg .big{font-size:2.6rem;line-height:1}
.dlg.won{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 10px 40px #000c}
.dlg.lost{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger),0 10px 40px #000c}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.92rem}
.dlg dt{color:var(--muted)} .dlg dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat-t{width:100%;border-collapse:collapse;font-size:.85rem}
.stat-t th,.stat-t td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.stat-t th{color:var(--muted);font-weight:500}
.stat-t td{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ibtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:24px;height:24px;padding:0;font-size:.8rem;line-height:22px;margin-left:4px;color:var(--accent)}
.gem{font-family:var(--mono);font-weight:700;margin-right:4px}
@keyframes gUp{0%{color:var(--ok);text-shadow:0 0 10px var(--ok)}100%{}}
@keyframes gDown{0%{color:var(--danger);text-shadow:0 0 10px var(--danger)}100%{}}
.meta b.up{animation:gUp 1s ease-out}.meta b.down{animation:gDown 1s ease-out}
.dlg>.btn{text-align:left}
.rlvl{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-left:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>BurbenogInspired <small id="modeTag">verbinde …</small></h1>
    <div class="stats" id="stats" hidden>
      <div class="stat"><b id="sDay"></b><span>Tag</span></div>
      <div class="stat" id="passBox"><b id="sPass"></b><span>Ganz durchgebrochen</span></div>
      <div class="stat"><b id="sNext"></b><span id="sNextL">Nächste Welle</span></div>
    </div>
  </header>

  <section id="setup" class="setup" hidden>
    <h2>Neues Spiel</h2>
    <div class="row">
      <label for="fPlayers">Spieler<select id="fPlayers"><option>2</option><option>3</option><option selected>4</option></select></label>
      <label for="fTiming" id="lTiming">Wellen kommen<select id="fTiming">
        <option value="test">Test: alle paar Minuten</option>
        <option value="real">Echt: 10, 13, 16, 19 Uhr</option></select></label>
      <label for="fLive">Spielart<select id="fLive">
        <option value="0">Uhrzeiten: Leaks kommen zur nächsten Welle</option>
        <option value="1">Live: Leaks laufen sofort beim Nachbarn weiter</option>
        <option value="k">Kreativ: Türme gratis testen, Welle frei wählbar (nur dieses Gerät, zählt nicht)</option></select></label>
      <label for="fDiff">Schwierigkeit<select id="fDiff">
        <option value="leicht">Leicht: Monster −25 % Leben</option>
        <option value="normal" selected>Normal</option>
        <option value="schwer">Schwer: Monster +25 % Leben</option></select></label>
    </div>
    <div class="row" id="rowTest"><label for="fInterval">Abstand zwischen Wellen (Minuten)<input id="fInterval" type="number" min="1" max="120" value="3"></label></div>
    <div class="row" id="rowReal" hidden><label for="fStart">Tag 1 ist<select id="fStart"><option value="0">heute</option><option value="1" selected>morgen</option></select></label></div>
    <p class="muted" id="setupHint" style="margin:0"></p>
    <div><button class="btn primary" id="fGo">Spiel starten</button></div>
  </section>

  <div id="game" hidden>
    <div id="kBar" class="row" hidden style="align-items:end;gap:10px;margin:0 0 8px"><label for="kWave">Kreativ-Modus: Welle<select id="kWave"></select></label><a class="btn" href="?">Kreativ-Modus beenden</a></div>
    <div class="clock" id="clock"></div>
    <div id="banner" class="banner" hidden></div>
    <div id="vbanner" class="banner bad" hidden></div>
    <div id="pausebanner" class="banner" hidden><b>⏸ Spiel pausiert</b> – keine Welle, bis jemand weiterspielt. <button class="btn primary" id="resumeBtn" style="margin-left:8px">Weiter spielen</button></div>
    <div id="flybanner" class="banner" hidden></div>
    <div class="today" id="today"></div>
    <div class="seats" id="seats"></div>
    <div class="controls">
      <button class="btn primary" id="ready" hidden></button>
      <button class="btn primary" id="go"></button>
      <button class="btn" id="replay">Letzte Welle ansehen</button>
      <button class="btn" id="spd" title="Tempo der Wiedergabe">Tempo 3×</button>
      <button class="btn" id="skip" hidden>Ende zeigen</button>
      <button class="btn" id="giftBtn">🎁 Schenken</button>
      <span class="spacer"></span>
      <button class="btn" id="more" aria-label="Menü">⋯</button>
    </div>
    <main class="lanes" id="lanes"></main>
    <section class="research" id="research"></section>
    <section class="log"><h2>Chronik</h2><ol id="log"></ol></section>
  </div>
</div>
<div id="pop" class="pop" hidden></div>
<div id="dlgback" class="dlgback" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="palette" id="palette" hidden>
  <div class="ptitle" id="ptitle"></div>
  <div class="prow" id="prow"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   ONLINE-SPEICHER (Firebase). Hier die Werte aus der Firebase-Konsole
   einfügen (Projekteinstellungen → Deine Apps → Web-App → firebaseConfig).
   Leer lassen = Ein-Gerät-Modus.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDqKXqGho_rQveqs7ltUR_vHykgGClgL1I",
  authDomain: "burbenoginspired.firebaseapp.com",
  projectId: "burbenoginspired",
  appId: "1:45840879921:web:f4f4f8bb60e49a091ae010"
};
const GAME_ID = "spiel1";   // anderer Name = eigenes, getrenntes Spiel
const VERSION = "2026-10-27e";  // bei JEDER Änderung hochzählen: alte Handys merken so, dass sie neu laden müssen

/* =====================================================================
   SPIELDATEN – Regeln und Zahlen. Alles hier darf geändert werden.
   */
const CONFIG = {
  days: 48,                 // Tage: 40 Runden (je ein Monstertyp) + 6 Zwischenbosse + 2 Endbosse (16.10.: Runde 21–40); 16.10. (L): 5. Monster im Block 4 (Eifersüchtige Geliebte), Endboss teilt sich die Runde der Vorhaut
  lossLimit: 30,            // mehr ganz durchgebrochene Monster = verloren
  startGold: 30,
  perWave: 20,              // Monster pro Welle (Boss: 1)
  /* Leben: baseHp × Runde^hpExp × hpMul × Spielerfaktor. Ausgelegt auf 40 Runden (Test: 20).
     Richtwert (11.10. nachts): Mit den Anfangstürmen schafft ein Spieler in den ersten Runden
     ca. 12 von 20 (2 Spieler), 8 (3 Spieler), 6 (4 Spieler). Kalibriert mit tools/kalibrieren.js. */
  baseHp: 14,               // 12.10.: neu kalibriert für 16 × 16
  playerHp: { 2:1, 3:1.25, 4:1.5 },
  hpExp: 1.38,              // 12.10. 15:38: etwas steiler (vorher 1,3; davor 1,5). Runde 2: ×2,6 · 5: ×9,2 · 10: ×24 · 20: ×63
  hpBlock: [1, 1.002, 1.081, 1.942, 3.518, 5.766, 8.289, 14.922],   // 17.10. (L): aus Balancing-Schleife 9;   // 16.10.: Lebensfaktor je Block (Runde 1–5, 6–10, …, 36–40), Stellschraube Balancing-Skript
  hpCutFrom: 3, hpCut: 0.95,  // 12.10.: ab Runde 3 (Nacktschnecken) alle Monster 5 % weniger Leben
  // Wellenzeiten je Spielerzahl: keine leeren Wellen, 19 Uhr (dunkel) ist immer dabei
  slotPlan: { 2:[10, 19], 3:[10, 16, 19], 4:[10, 13, 16, 19] },
  darkFrom: 19,             // ab 19 Uhr ist es dunkel: Schatten trifft nachtaktive Monster nur im Irrlicht-Kreis
  firstWaveDelay: 1,        // Testmodus: erste Welle erst nach 1 Minute
  maxLevel: 6,              // Stufe 1 + 5 Upgrades
  upgradeCost: 1.5,         // jedes Upgrade kostet 1,5 × so viel wie das vorige
  upgrade: { dmg:2.1, firstDmg:2.35, steps:[2.35, 2.1, 1.85, 1.7, 1.6], range:0.2, dur:1.3, eff:1.15 },  // 12.10. 11:01: erstes Upgrade ×2,2, danach je ×2,1. Schaden/s je Stufe auf 0,1 aufgerundet
   // pro Upgrade: Schaden ×2, Reichweite +0,2, Effektdauer ×1,3, Effektstärke ×1,15
  giftFee: 0.10, giftStep: 10,
  weatherChange: 0.35,      // Chance, dass das Wetter vor einer Welle umschlägt
  spawnGap: 0.9,            // Sekunden zwischen zwei Monstern (früher 0,5: Flächenschaden war zu stark)
  immune: 0.5,              // Schadensfaktor bei weak = 0 (war 0,25)
  splashEdge: 0.7,          // Flächenschaden fällt nach außen ab: Mitte 100 %, Rand 70 % (11.10. abends: war 40 %)
  shotSpeed: 9, lobSpeed: 6.5, lobMid: 1.4, lobFast: 1.8,   // Wurf: siehe lobSpeedOf  // Geschosse in Feldern/s: gezielte fliegen dem Ziel nach, Flächen-Geschosse (Wurf) fliegen auf den Punkt, wo das Ziel beim Abschuss war
  stunMax: 5,               // Betäubung höchstens 5 s
  sellRefund: 0.5
};
const DAY = 'Tag';
// Gelände: Bauen kostet je nach Feld mehr. Stein zahlt keinen Aufschlag.
const TERRAIN = [
  { name:'Wiese', extra:0,  col:['#24301f','#2a3824'] },
  { name:'Wald',  extra:10, col:['#17271a','#1b2e1e'] },
  { name:'Sumpf', extra:20, col:['#25302f','#2b3735'] },
  { name:'Felsen', extra:30, stoneExtra:30, col:['#2c2c30','#323237'] }   // 13.10. (F): Felsen +15 % Reichweite für alle, Stein macht mehr Schaden. 14.10. (L): alle zahlen +30
];
const ROCK = { rangeMul:1.15, stoneDmg:1.3, min:6, max:8 };   // Felsen je Karte 6–8, neu gewürfelt bei jedem neuen Spiel
const TERRAIN_MAX = 26;     // Wald- und Sumpffelder je Karte bei 63 Feldern Weg, kürzerer Weg = etwas weniger
// Forschung: drei Gebäude, alle zahlen gemeinsam aus der Gemeinschaftskasse (ohne Gebühr).
// 14.10. (L): jede Verbesserung in 3 Stufen, Stufe 1 billig (früh relevant). Freischaltungen ungestuft, teurer als ein Turm der freigeschalteten Stufe.
const RESEARCH_GROUPS = [
  { grp:'t5',    house:'Bauhütte',     name:'Türme 5–6 freischalten', costs:[250] },
  { grp:'t7',    house:'Bauhütte',     name:'Türme 7–8 freischalten', costs:[700], need:'t5:1' },
  { grp:'cheap', house:'Bauhütte',     name:'Upgrades billiger',      costs:[40, 80, 130],  steps:[0.07, 0.14, 0.2],  fmt:v => '−' + Math.round(v*100) + ' %' },
  { grp:'el0',   house:'Elementlabor', name:'Feuer Schaden',          costs:[25, 40, 55],   steps:[0.08, 0.16, 0.25], fmt:v => '+' + Math.round(v*100) + ' %', el:0 },
  { grp:'el1',   house:'Elementlabor', name:'Eis Schaden',            costs:[25, 40, 55],   steps:[0.08, 0.16, 0.25], fmt:v => '+' + Math.round(v*100) + ' %', el:1 },

  m.v = 'warg'; m.def = variantDef(base, 'warg'); m.hp = H * 0.5; m.ap = 0;
  const o = { id:m.id + .5, type:m.type, v:'ork', def:variantDef(base, 'ork'), hp:H * 0.5, ap:0, d:m.d, x:m.x, y:m.y, fx:JSON.parse(JSON.stringify(m.fx)), hops:m.hops, age:0 };

  s.monsters.push(o); s.fx.push({ kind:'boom', x:m.x, y:m.y, r:0.5 * GRID, t:.3, t0:.3, el:3 });

// Weg des Orks: kürzester Weg auf dem Raster (8 Richtungen) vom Absteigen bis zum Ausgang. Türme, Felsen und Sumpf sind Hindernisse,

function orkRoute(s, x0, y0){

// Magiermeister: geht erst ein Stück wie ein normales Monster (17.10.), steht dann auf N Wegpunkten mit gleichem Abstand,
// in gemischter Reihenfolge (fester Seed), danach die letzten Felder zu Fuß
function teleportPlan(s, d){

// Lehrer: jeder hat eine eigene Mischung aus Faktoren (eine „Immunität“, einen Bonus, der Rest gemischt)

// Schulleiter: auf jeder Map das Wetter, das dem Element der Map am meisten schadet (Stein ist wetterfest)

function spawn(s, sp){
  let d = monsterDef(sp.type, s.players); if (sp.v) d = variantDef(d, sp.v);
  const [x,y] = posAt(s.map, 0);
  const m = { id:s.t + s.monsters.length * .37, type:sp.type, def:d, hp: sp.hp > 0 ? sp.hp : d.hp, ap: sp.ap !== undefined ? sp.ap : d.armorPts, d:0, x, y, fx: sp.fx || {}, hops:sp.hops, age:0, v:sp.v };
  if (sp.weak || d.mixed) m.weak = sp.weak || mixedWeak(s.rand);

  if (d.blink) m.blinkPh = s.rand() * d.blink.every;                         // 17.10.: jeder Novize mit eigenem Takt
  if (d.charm) m.charmCd = d.charm.every;

// Durchbohren (Eisspeer): gerade Linie über die ganze Karte, Richtung so, dass möglichst viele Monster getroffen werden

function setPause(on){

    else if (g.cfg.timing === 'real') for (let k = 0; k < 400; k++) { const due = dueTime(g); if (!due || due >= now) break; const d = new Date(g.cfg.day1); d.setDate(d.getDate() + 1); g.cfg.day1 = d.getTime(); }
    delete g.paused; return g; };
  if (MODE === 'local') { G = mark(G); lsSet('ww2-local', { G, L }); render(); return; }
  const ref = DB.doc(P_STATE);
  queueWrite(async () => {
    if (DB.tx) await DB.tx(async tr => { const snap = await tr.get(ref); if (!snap.exists) return; tr.set(ref, mark(JSON.parse(JSON.stringify(snap.data())))); });
    else { const snap = await ref.get(); if (snap.exists) await ref.set(mark(JSON.parse(JSON.stringify(snap.data())))); }

}

// Wetter auf der Karte: Symbol oben rechts; während der Wiedergabe leichter Regen bzw. Gewitterblitze (im Menü abschaltbar)

}

    for (let j = 0; j < 40; j++) { const sx = ((j * 0.6180339) % 1) * W, sp = H * 1.4;

/* ---------- Start ---------- */
function createCreative(){
  const cfg = { players:4, timing:'manual', interval:3, startAt:Date.now(), live:false, diff:'normal', startGold:0, version:VERSION, slots:[10], kreativ:true };
  G = newGameState(cfg); G.kDay = 1; G.log = [{ when:'Kreativ', text:'Kreativ-Modus: alle Türme gratis, Welle frei wählbar.' }];
  L = [0,1,2,3].map(i => ({ el:i, towers:[], spent:0, gifts:[], gid:cfg.startAt, research:['t5:1','t7:1'] }));
  seat = 0; selTower = null; selCell = null; replay = null; lanesBuilt = 0; lsSet('ww2-local', { G, L }); render();
}
async function newGame(){
  if (KREATIV) return createCreative();
  if ($('fLive').value === 'k') { location.href = location.pathname + '?kreativ=1'; return; }
  const players = +$('fPlayers').value, timing = MODE === 'online' ? $('fTiming').value : 'manual';
  const cfg = { players, timing, interval: Math.max(1, +$('fInterval').value || 3), startAt: Date.now(), live: $('fLive').value === '1', diff: $('fDiff').value, startGold: CONFIG.startGold, version: VERSION };
  cfg.slots = cfg.live ? [10] : CONFIG.slotPlan[players];   // Live: eine Welle am Tag, alles läuft ineinander
  if (timing === 'real') { const d = new Date(); d.setDate(d.getDate() + (+$('fStart').value)); d.setHours(0,0,0,0); cfg.day1 = d.getTime(); }
  G = newGameState(cfg);
  L = [...Array(players)].map((_,i) => ({ el:i % ELEMENTS.length, towers:[], spent:0, gifts:[], gid:cfg.startAt }));
  seat = 0; selTower = null; selCell = null; replay = null; lanesBuilt = 0;
  if (MODE === 'local') lsSet('ww2-local', { G, L });
  else { await queueWrite(async () => { for (let i = 0; i < 4; i++) await DB.doc(P_LANES + '/p' + i).set(L[i] || { el:i, towers:[], spent:0, gifts:[], gid:cfg.startAt }); await DB.doc(P_STATE).set(JSON.parse(JSON.stringify(G))); }); }
  render();
}
function onGame(g){
  const prevPlayers = G && G.cfg.players;
  G = g;
  if (!G) { lanesBuilt = 0; render(); return; }
  if (seat >= NP()) seat = 0;
  if (prevPlayers !== G.cfg.players) lanesBuilt = 0;
  if (G.lastRun && G.lastRun.id !== seenRun && replay && (document.hidden || performance.now() - replay.last > 3000)) endReplay();   // 27.10. (F): Alte Wiedergabe stand still (Tab im Hintergrund, Laptop im Ruhezustand) – sie blockierte die neue Welle und das Auslösen
  syncAt = Date.now();
  if (G.lastRun && G.lastRun.id !== seenRun && !replay) { if (seenRun) startReplay(G.lastRun); else { seenRun = G.lastRun.id; lsSet('ww2-seen', seenRun); } }
  render();
}

$('fTiming').onchange = renderSetup;
$('fGo').onclick = newGame;
$('go').onclick = () => tryResolve(true);
$('resumeBtn').onclick = resumeGame;
$('ready').onclick = toggleReady;
$('replay').onclick = () => G && startReplay(G.lastRun, true);
$('skip').onclick = endReplay;
$('spd').onclick = () => { speed = speed === 1 ? 3 : speed === 3 ? 10 : 1; render(); };
$('giftBtn').onclick = giftDialog;
$('more').onclick = menuDialog;
window.addEventListener('resize', () => { for (let i = 0; i < 4; i++) { const cv = $('cv'+i); if (cv) cv.width = 0; } drawAll(); });
setInterval(() => { renderClock(); if (G && !replay && seenRun) nextReplay();   // Sicherheitsnetz: keine Welle verpassen
   // Wächter: Steht die Wiedergabe seit 3 s still, obwohl die Seite sichtbar ist, neu anstoßen
   if (replay && !document.hidden && performance.now() - replay.last > 3000) kickLoop();
   checkReady(); saveStatus();
   if (MODE === 'online' && G && !G.over && !G.paused) { const due = dueTime(G); if (due && Date.now() >= due) tryResolve(false); } }, 5000);

function startLocal(){
  MODE = 'local';
  const s = lsGet('ww2-local');
  if (s && s.G) { L = s.L || []; seenRun = s.G.lastRun && s.G.lastRun.id; onGame(s.G); } else if (KREATIV) createCreative(); else render();
}
async function startOnline(db){
  MODE = 'online'; DB = db;
  if (!DB.tx) { try { const u = await window.claude.use('user'); ME = u && await u.id(); } catch(e){} }
  if (!ME) { ME = lsGet('ww2-holder') || ('h' + Math.random().toString(36).slice(2)); lsSet('ww2-holder', ME); }
  seat = lsGet('ww2-seat') || 0; seenRun = lsGet('ww2-seen');
  DB.collection(P_LANES).onSnapshot(snap => {
    snap.docs.forEach(d => { const k = +d.id.slice(1); if (!d.metadata.hasPendingWrites || !L[k]) takeLane(k, d.data()); });
    if (G) render();
  }, e => console.warn(e));
  DB.doc(P_STATE).onSnapshot(snap => onGame(snap.exists ? snap.data() : null), e => { console.warn(e); toast('Verbindung verloren. Bitte Seite neu laden.'); });
  // Zweite Leitung: Handys lassen die Live-Verbindung oft einschlafen (App-Wechsel, Bildschirm aus).
  // Deshalb alle 10 s und beim Zurückkehren den Stand direkt vom Server holen.
  // Wer selbst „Bereit“ gedrückt hat und wartet, fragt alle 2 s (Safari meldet die Live-Änderung oft nicht), sonst alle 10 s.
  let pollTick = 0;
  setInterval(() => { pollTick++; const waiting = G && !G.over && !replay && isReady(seat);
    if (waiting || pollTick % 5 === 0) refreshFromServer(); }, 2000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else { if (replay && hiddenAt && Date.now() - hiddenAt > 20000) endReplay();   // war länger weg: nicht ewig in Zeitlupe nachspielen
    refreshFromServer(); } });

}
let refreshing = false;
async function refreshFromServer(){

  try {
    // Zeitlimit: Eine hängende Abfrage blockierte vorher alle weiteren (refreshing blieb true) – dann half nur Neuladen
    const limit = new Promise((_, no) => setTimeout(() => no(new Error('Zeitlimit Server-Abfrage')), 8000));
    const [st, ls] = await Promise.race([Promise.all([DB.doc(P_STATE).get({ source:'server' }), DB.collection(P_LANES).get({ source:'server' })]), limit]);

(async () => {
  render();

      try { fs.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false, merge: true }); } catch(e) { console.warn(e); }   // Safari: WebChannel-Verbindung hängt oft, Long Polling ist der bekannte Ausweg

    } catch(e) { console.warn(e); }
