<!doctype html><meta charset="utf-8"><title>Dorf, Arbeiter, Biome – Entwurf</title>
<style>
body{margin:0;background:#1d2a1c;color:#e8eadf;font:14px system-ui,sans-serif;padding:20px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 6px;border-bottom:1px solid #fff3;padding-bottom:4px}
p.n{margin:2px 0 10px;color:#b9c4b0;max-width:900px}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;margin-bottom:8px}
.sp{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#b9c4b0;background:#2a3b28;border-radius:8px;padding:4px 4px 2px}
.sp svg{display:block}
.lab{width:70px;align-self:center;font-weight:600;color:#e8eadf}
</style>
<h1>BurbenogInspired – Dorf, Arbeiter, Biome (Entwurf 26.10.)</h1>
<p class="n">Nur Bilder zum gemeinsamen Überarbeiten, noch nichts im Spiel. Maßstab: ein Dorf = genau ein Feld breit, ein Arbeiter ist etwa ein Viertel Feld hoch.</p>
<div id="out"></div>
<script>
const P = {
 f:{n:'Feuer', wall:'#7a4a2a', wallD:'#5a3118', roof:'#c2410c', roofL:'#e8590c', acc:'#ffb347', ground:'#4a2e1c', groundL:'#6d4529', glow:'#ff8a3d', flag:'#d8321a', dark:'#1f0e06', win:'#ffd27a', tunic:'#c2410c', cap:'#7a2a12', fire:'#ff8a3d', fireC:'#ffe08a', stone:'#6b5047', stoneD:'#4a362f', moat:'#ff6a1e', moatD:'#7a2a12', moatL:'#ffd27a'},
 e:{n:'Eis', wall:'#5f9cc4', wallD:'#386f97', roof:'#cfe9f6', roofL:'#f2fbff', acc:'#2f6389', ground:'#b9d6e6', groundL:'#dff0f8', glow:'#7df9ff', flag:'#3f7fa6', dark:'#2f5a78', win:'#9be8ff', tunic:'#3f7fa6', cap:'#eaf8ff', fire:'#7df9ff', fireC:'#ffffff', stone:'#6aa6cc', stoneD:'#3a6f96', moat:'#9be8ff', moatD:'#3f7fa6', moatL:'#ffffff'},
 s:{n:'Schatten', wall:'#2b2140', wallD:'#150e2b', roof:'#3d2a78', roofL:'#5b3aa8', acc:'#a98bff', ground:'#1a1230', groundL:'#2d2250', glow:'#a98bff', flag:'#7a4be0', dark:'#07040f', win:'#c9b6ff', tunic:'#4d3a8a', cap:'#150e2b', fire:'#a98bff', fireC:'#f0e6ff', stone:'#352a52', stoneD:'#1a1230', moat:'#4d3a8a', moatD:'#150e2b', moatL:'#a98bff'},
 st:{n:'Stein', wall:'#a89c84', wallD:'#7d725e', roof:'#8a6238', roofL:'#b08650', acc:'#d9cba6', ground:'#6f6450', groundL:'#8d8270', glow:'#ffb347', flag:'#8d3b2c', dark:'#2a2218', win:'#ffd27a', tunic:'#8a6238', cap:'#5e5646', fire:'#ff9a3d', fireC:'#ffe08a', stone:'#a89c84', stoneD:'#7d725e', moat:'#2f7fb3', moatD:'#1f4f73', moatL:'#bfe3f5'}
};
const SKIN='#f0c9a0', SKIND='#c99a72';
const svg=(vb,w,h,inner)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${w}" height="${h}">${inner}</svg>`;
// ---------- Dorf ----------
function hut(k,p,x,y,s){
 let b='';
 if(k==='f') b=`<path d="M-9 0V-12H9V0Z" fill="${p.wall}"/><path d="M3 0V-12H9V0Z" fill="${p.wallD}"/><path d="M-9 -4H9M-9 -8H9" stroke="${p.wallD}" stroke-width=".7"/><path d="M-13 -11L0 -23L13 -11Z" fill="${p.roof}"/><path d="M0 -23L13 -11H0Z" fill="${p.roofL}"/><rect x="5" y="-26" width="4" height="8" fill="${p.wallD}"/><rect x="4.5" y="-27" width="5" height="1.6" fill="${p.dark}"/><circle cx="7" cy="-28.5" r="1.3" fill="${p.glow}"/><path d="M-3 0V-7Q0 -10 3 -7V0Z" fill="${p.dark}"/><rect x="-7.5" y="-9" width="3" height="3" fill="${p.win}"/>`;
 if(k==='e') b=`<path d="M-12 0A12 12 0 0 1 12 0Z" fill="${p.wall}"/><path d="M4 -11.3A12 12 0 0 1 12 0H4Z" fill="${p.wallD}" opacity=".55"/><path d="M-11 -4H11M-9 -8H9M-5 -11H5M-4 0V-5M4 0V-5M0 -5V-10M-8 -4V-8M8 -4V-8" stroke="${p.wallD}" stroke-width=".7" fill="none"/><path d="M-4 0V-4Q0 -8 4 -4V0Z" fill="${p.dark}"/><path d="M-8 -9Q-3 -13 3 -12" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M-12 0H12" stroke="${p.acc}" stroke-width="1.2"/><path d="M9 -8L12 -14L14 -8Z" fill="${p.acc}"/>`;
 if(k==='s') b=`<path d="M-8 0L-7 -14H7L8 0Z" fill="${p.wall}"/><path d="M2 0V-14H7L8 0Z" fill="${p.wallD}"/><path d="M-11 -13L-1 -25Q2 -34 3 -31L11 -13Z" fill="${p.roof}"/><path d="M3 -31L11 -13H0Z" fill="${p.roofL}"/><path d="M-11 -13H11" stroke="${p.acc}" stroke-width="1"/><path d="M-3 0V-6Q0 -10 3 -6V0Z" fill="${p.dark}"/><path d="M-5.5 -9.5V-11.5Q-4 -13 -2.5 -11.5V-9.5Z" fill="${p.win}"/><circle cx="2" cy="-35" r="1.4" fill="${p.acc}" opacity=".8"/><circle cx="-3" cy="-38" r="1" fill="${p.win}" opacity=".6"/>`;
 if(k==='st') b=`<path d="M-9 0V-12H9V0Z" fill="${p.wall}"/><path d="M3 0V-12H9V0Z" fill="${p.wallD}"/><path d="M-9 -4H9M-9 -8H9M-4 0V-4M2 -4V-8M-3 -8V-12M5 -8V-12" stroke="${p.wallD}" stroke-width=".7"/><path d="M-13 -11L0 -22L13 -11Z" fill="${p.roof}"/><path d="M-9 -13L-7 -11M-4 -17L-2 -11M2 -18L4 -11M7 -15L9 -11" stroke="${p.roofL}" stroke-width="1.3"/><path d="M-3 0V-7Q0 -10 3 -7V0Z" fill="#4a3220"/><rect x="-7.5" y="-9" width="3" height="3" fill="${p.win}"/>`;
 return `<g transform="translate(${x} ${y}) scale(${s})">${b}</g>`;
}
function tent(p,x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-10 0L0 -15L10 0Z" fill="${p.roof}"/><path d="M0 -15L10 0H0Z" fill="${p.roofL}"/><path d="M-3 0L0 -8L3 0Z" fill="${p.dark}"/><path d="M0 -15V-18" stroke="${p.wallD}" stroke-width="1"/></g>`}
function fire(p,x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="5" ry="1.8" fill="${p.dark}" opacity=".5"/><path d="M-3 -.5L3 -1.5M-3 -1.5L3 -.5" stroke="${p.wallD}" stroke-width="1.6" stroke-linecap="round"/><path d="M-3 -2Q-3.5 -7 0 -10Q1 -6 3 -5Q4 -2 3 -2Z" fill="${p.fire}"/><path d="M-1.4 -2Q-1.6 -5 0 -6.5Q1.2 -4 1.4 -2Z" fill="${p.fireC}"/></g>`}
function well(p,x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="-3" rx="5" ry="2.4" fill="${p.wallD}"/><path d="M-5 -3V0Q0 3 5 0V-3Z" fill="${p.wall}"/><ellipse cx="0" cy="-3" rx="3.4" ry="1.4" fill="${p.dark}"/><path d="M-4.5 -3V-11M4.5 -3V-11" stroke="${p.wallD}" stroke-width="1.2"/><path d="M-6.5 -10L0 -15L6.5 -10Z" fill="${p.roof}"/></g>`}
function crates(p,x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-6" y="-5" width="6" height="5" fill="${p.wall}" stroke="${p.wallD}" stroke-width=".7"/><rect x="0" y="-4" width="5" height="4" fill="${p.wallD}"/><rect x="-4" y="-9" width="5" height="4" fill="${p.wall}" stroke="${p.wallD}" stroke-width=".7"/><path d="M-6 -5L0 0M0 -5L-6 0" stroke="${p.wallD}" stroke-width=".5"/></g>`}
function banner(p,x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0V-24" stroke="${p.wallD}" stroke-width="1.4"/><path d="M0 -24H9L6.5 -20L9 -16H0Z" fill="${p.flag}"/><circle cx="0" cy="-24.5" r="1.2" fill="${p.acc}"/></g>`}
function tower(p,x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-5 0V-22H5V0Z" fill="${p.wall}"/><path d="M1 0V-22H5V0Z" fill="${p.wallD}"/><path d="M-5 -8H5M-5 -15H5" stroke="${p.wallD}" stroke-width=".6"/><path d="M-7 -21L0 -31L7 -21Z" fill="${p.roof}"/><path d="M0 -31L7 -21H0Z" fill="${p.roofL}"/><rect x="-1.4" y="-19" width="2.8" height="4" fill="${p.win}"/></g>`}
function fence(p,x1,x2,y){let o='';for(let x=x1;x<=x2;x+=5)o+=`<path d="M${x} ${y}V${y-6}" stroke="${p.wallD}" stroke-width="1.3"/>`;return o+`<path d="M${x1} ${y-4}H${x2}M${x1} ${y-1.5}H${x2}" stroke="${p.wall}" stroke-width=".9"/>`}
function smoke(p,x,y){return `<g opacity=".55" fill="${p.k==='s'?'#7a4be0':'#cfd6d8'}"><circle cx="${x}" cy="${y}" r="2"/><circle cx="${x+2}" cy="${y-4}" r="2.6"/><circle cx="${x+1}" cy="${y-9}" r="3.2"/></g>`}
function ground(p,w){return `<ellipse cx="0" cy="1" rx="${w}" ry="${w*.24}" fill="${p.ground}"/><ellipse cx="-4" cy="0" rx="${w*.7}" ry="${w*.15}" fill="${p.groundL}" opacity=".7"/>`}
// Burg-Bauteile (Vorderansicht, Fuß bei y=0)
function crenel(x1,x2,y,c){let o='';const n=Math.max(2,Math.round((x2-x1)/4.2)),w=(x2-x1)/(2*n-1);for(let i=0;i<n;i++)o+=`<rect x="${(x1+i*2*w).toFixed(2)}" y="${y-3}" width="${w.toFixed(2)}" height="3.4" fill="${c}"/>`;return o}
function wallSeg(p,x1,x2,h){let o=`<rect x="${x1}" y="${-h}" width="${x2-x1}" height="${h}" fill="${p.stone}"/><rect x="${x1}" y="${-h}" width="${x2-x1}" height="2" fill="${p.stoneD}" opacity=".5"/>`;
 for(let y=-3;y>-h;y-=4)o+=`<path d="M${x1} ${y}H${x2}" stroke="${p.stoneD}" stroke-width=".5" opacity=".7"/>`;
 return o+crenel(x1,x2,-h,p.stone)}
function towerS(p,x,w,h,roof,flag){const x1=x-w/2;let o=`<rect x="${x1}" y="${-h}" width="${w}" height="${h}" fill="${p.stone}"/><rect x="${x+w*.1}" y="${-h}" width="${w*.4}" height="${h}" fill="${p.stoneD}" opacity=".45"/>`;
 for(let y=-4;y>-h;y-=4.5)o+=`<path d="M${x1} ${y}H${x1+w}" stroke="${p.stoneD}" stroke-width=".5" opacity=".7"/>`;
 o+=`<rect x="${x-.9}" y="${-h*.62}" width="1.8" height="${Math.min(6,h*.2)}" rx=".9" fill="${p.win}"/>`;
 if(roof){o+=`<rect x="${x1-1}" y="${-h-1.4}" width="${w+2}" height="2.6" fill="${p.stoneD}"/><path d="M${x1-1.8} ${-h-1}L${x} ${-h-w*1.15}L${x1+w+1.8} ${-h-1}Z" fill="${p.roof}"/><path d="M${x} ${-h-w*1.15}L${x1+w+1.8} ${-h-1}H${x}Z" fill="${p.roofL}"/>`;
  if(flag)o+=`<path d="M${x} ${-h-w*1.15}V${-h-w*1.15-8}" stroke="${p.stoneD}" stroke-width="1"/><path d="M${x} ${-h-w*1.15-8}H${x+7}L${x+5} ${-h-w*1.15-5.5}L${x+7} ${-h-w*1.15-3}H${x}Z" fill="${p.flag}"/>`;}
 else o+=`<rect x="${x1-1}" y="${-h-1}" width="${w+2}" height="2.2" fill="${p.stoneD}"/>`+crenel(x1-1,x1+w+1,-h-1,p.stone);
 return o}
function gateS(p,x,w,h){return `<path d="M${x-w/2} 0V${-h+w/2}A${w/2} ${w/2} 0 0 1 ${x+w/2} ${-h+w/2}V0Z" fill="${p.dark}"/><path d="M${x-w/2+1.4} 0V${-h+w/2}M${x} 0V${-h+w/2-1}M${x+w/2-1.4} 0V${-h+w/2}M${x-w/2} ${-h*.5}H${x+w/2}" stroke="${p.wallD}" stroke-width=".7" opacity=".8"/>`}
function moatS(p,w){return `<ellipse cx="0" cy="4" rx="${w}" ry="6.4" fill="${p.moatD}"/><ellipse cx="0" cy="3.4" rx="${w-1.8}" ry="5" fill="${p.moat}"/><path d="M${-w*.55} 3Q${-w*.4} 1.6 ${-w*.25} 3M${w*.2} 5Q${w*.4} 3.6 ${w*.55} 5" stroke="${p.moatL}" stroke-width=".7" fill="none"/>`}
function bridgeS(p,x){return `<path d="M${x-4.5} 0H${x+4.5}L${x+6.5} 8H${x-6.5}Z" fill="#6b4a2c"/><path d="M${x-3} 1.5L${x-4.2} 7.5M${x} 1.5V7.5M${x+3} 1.5L${x+4.2} 7.5" stroke="#4a3220" stroke-width=".7"/>`}
function palisade(p,x1,x2,y){let o='';for(let x=x1;x<=x2;x+=3.4)o+=`<path d="M${x-1.4} ${y}V${y-8}L${x} ${y-10.5}L${x+1.4} ${y-8}V${y}Z" fill="${p.wall}" stroke="${p.wallD}" stroke-width=".4"/>`;return o}
function socle(k,st){   // 27.10.: dunkler Sockel unter dem Dorf, damit es sich vom Boden abhebt (wächst mit der Stufe)
 const C={f:['#1a0e08','#3a2417','#5a3a22','#ff8a3d'],e:['#173a57','#2f6389','#4d8cb5','#bfe3f3'],s:['#0a0618','#1c1236','#2d2250','#a98bff'],st:['#3d3629','#5a5242','#7d7360','#d9cba6']}[k];
 const r=[0,15,23,27,31,34,34][st]; if(!r) return '';
 return `<ellipse cx="0" cy="${r*.13+2}" rx="${r}" ry="${r*.3}" fill="${C[0]}"/><ellipse cx="0" cy="${r*.09+1}" rx="${r*.97}" ry="${r*.26}" fill="${C[1]}"/><ellipse cx="-1" cy="${r*.04}" rx="${r*.82}" ry="${r*.19}" fill="${C[2]}"/><path d="M${-r*.8} ${r*.15}l4 -1.5M${r*.55} ${r*.2}l6 -2M${-r*.2} ${r*.28}l4 -.8" stroke="${C[3]}" stroke-width=".9" fill="none" opacity=".85"/>`;
}
function village(k,stage){
 const p={...P[k],k}; let b='';
 const g=(w)=>ground(p,w);
 if(stage===0) b=`<ellipse cx="0" cy="1" rx="9" ry="2.4" fill="${p.ground}" opacity=".8"/><path d="M-3 0L0 -3L3 0Z" fill="${p.groundL}"/>`;
 if(stage===1) b=g(16)+tent(p,-5,0,1)+fire(p,9,3,1);
 if(stage===2) b=g(20)+hut(k,p,-3,0,1)+fire(p,13,3,1);
 if(stage===3) b=g(27)+hut(k,p,-12,-3,.95)+hut(k,p,12,-2,.9)+tower(p,0,-8,1)+palisade(p,-26,26,6)+banner(p,27,4,.8)+smoke(p,-9,-27);          // Dorf mit Palisade und Wachturm
 if(stage===4) b=g(30)+hut(k,p,9,-4,.7)+wallSeg(p,-24,24,12)+gateS(p,0,9,9)+towerS(p,-24,11,22,false)+towerS(p,24,11,22,p.roof,true)+smoke(p,6,-22);   // erste Steinmauer mit Tor
 if(stage===5) b=g(32)+towerS(p,0,15,36,p.roof,true)+wallSeg(p,-24,24,13)+gateS(p,0,10,10)+towerS(p,-26,11,24,p.roof)+towerS(p,26,11,24,p.roof)+`<path d="M-4 -4H4" stroke="${p.glow}" stroke-width="1.2" opacity=".9"/>`;    // Burg mit Bergfried
 if(stage===6) b=moatS(p,33)+g(30)+towerS(p,0,17,40,p.roof,true)+towerS(p,-14,10,30,p.roof)+towerS(p,14,10,30,p.roof,true)+wallSeg(p,-24,24,14)+gateS(p,0,10,11)+towerS(p,-27,12,25,p.roof,true)+towerS(p,27,12,25,p.roof)+bridgeS(p,0);   // Ritterburg
 return svg('-40 -66 80 84',240,252,socle(k,stage)+b);
}
// ---------- Arbeiter ----------
function worker(k,job,fr){
 const p=P[k]; let b=`<ellipse cx="0" cy="1" rx="6" ry="1.6" fill="#0005"/>`;
 // Standbein-Pose leicht versetzt, damit es nach Arbeit aussieht
 const lean=job==='fisch'?0:(fr?1.2:-.8);
 b+=`<rect x="${-3.4-lean*.3}" y="-8" width="2.8" height="8" fill="${p.dark}"/><rect x="${.6+lean*.3}" y="-8" width="2.8" height="8" fill="${p.dark}"/>`;
 b+=`<g transform="translate(${lean} 0)"><path d="M-4.6 -8L-3.8 -18H3.8L4.6 -8Z" fill="${p.tunic}"/><path d="M-4.6 -9.5H4.6" stroke="${p.dark}" stroke-width=".9"/></g>`;
 // Hand-Positionen (Schulter ist bei (3.4,-16.5)); Werkzeugwinkel folgt dem Schwung
 const H={holz:[[5.5,-26,-75],[9.5,-12.5,40]],berg:[[5.5,-26,-75],[9.5,-12.5,40]],fisch:[[9,-17.5,-14],[9,-14,10]]}[job][fr];
 const [hx,hy,ang]=H, sh=[3.4+lean,-16.5];
 const ex=(sh[0]+hx)/2+(job==='fisch'?-.5:(fr?-2.4:2.6)), ey=(sh[1]+hy)/2+(fr?1.6:-.2);
 // hinterer Arm (hängt, bei Angler stützt er)
 b+=`<path d="M${-3.6+lean} -16.5Q${-6.5+lean} -13 ${job==='fisch'?-1:-5.4} ${job==='fisch'?-12:-10}" stroke="${SKIND}" stroke-width="2.1" fill="none" stroke-linecap="round"/>`;
 let tool='';
 if(job==='holz') tool=`<path d="M0 3.5L0 -16" stroke="#6b4a2c" stroke-width="1.6" stroke-linecap="round"/><path d="M-.6 -16L-7.4 -18.2L-8 -11.6L-.6 -11.6Z" fill="#c9c9cf"/><path d="M-7.4 -18.2L-8 -11.6" stroke="#fff" stroke-width=".8"/>`;
 if(job==='berg') tool=`<path d="M0 3.5L0 -16" stroke="#6b4a2c" stroke-width="1.6" stroke-linecap="round"/><path d="M-7.6 -14.4Q0 -19.6 7.6 -14.4L6 -13Q0 -16.8 -6 -13Z" fill="#9aa0a8"/><path d="M-7.6 -14.4L-6.4 -13M7.6 -14.4L6.4 -13" stroke="#cfd6dc" stroke-width=".8"/>`;
 if(job==='fisch') tool=`<path d="M0 5L0 -22" stroke="#7a5a30" stroke-width="1.2" stroke-linecap="round"/><path d="M0 -22Q-4 -27 -15 -23" stroke="#7a5a30" stroke-width=".8" fill="none"/><path d="M-15 -23V${fr?-9:-5}" stroke="#fff" stroke-width=".5" opacity=".8"/><circle cx="-15" cy="${fr?-7:-3}" r="1.2" fill="${p.flag}"/>`;
 b+=`<g transform="translate(${hx} ${hy}) rotate(${ang})">${tool}</g>`;
 // vorderer Arm mit Ellbogen über dem Werkzeuggriff
 b+=`<path d="M${sh[0]} ${sh[1]}Q${ex} ${ey} ${hx} ${hy}" stroke="${SKIN}" stroke-width="2.3" fill="none" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="1.5" fill="${SKIN}"/>`;
 b+=`<circle cx="${lean*.6}" cy="-21.5" r="4" fill="${SKIN}"/><circle cx="${1.5+lean*.6}" cy="-21.6" r=".6" fill="#2a1a10"/><circle cx="${-1.6+lean*.6}" cy="-21.6" r=".6" fill="#2a1a10"/><path d="M${-1+lean*.6} -19.6Q${lean*.6} -18.8 ${1.2+lean*.6} -19.6" stroke="${SKIND}" stroke-width=".5" fill="none"/>`;
 const g=`translate(${lean*.6} 0)`;
 if(job==='holz') b+=`<g transform="${g}"><path d="M-4.4 -23.5Q0 -29 4.4 -23.5Z" fill="${p.cap}"/><rect x="-4.6" y="-24" width="9.2" height="1.4" fill="${p.acc}"/></g>`;
 if(job==='berg') b+=`<g transform="${g}"><path d="M-4.6 -23Q0 -29.5 4.6 -23Z" fill="#d9b030"/><rect x="-5" y="-23.6" width="10" height="1.3" fill="#a88a20"/><circle cx="2.4" cy="-26" r="1.2" fill="${p.glow}"/></g>`;
 if(job==='fisch') b+=`<g transform="${g}"><ellipse cx="0" cy="-24.2" rx="7" ry="1.6" fill="#d9b45a"/><path d="M-3.6 -24.4Q0 -29.5 3.6 -24.4Z" fill="#e6c570"/><rect x="-3.7" y="-25.2" width="7.4" height="1" fill="${p.flag}"/></g>`;
 return svg('-20 -38 40 44',160,176,b);
}
// ---------- Biome ----------
function pine(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-1.4" y="-5" width="2.8" height="5" fill="#5a3a20"/><path d="M-8 -4L0 -16L8 -4Z" fill="#2c6a35"/><path d="M-6.5 -10L0 -22L6.5 -10Z" fill="#35793f"/><path d="M-5 -16L0 -28L5 -16Z" fill="#3f8d4a"/><path d="M0 -28L5 -16H0Z" fill="#2c6a35" opacity=".5"/></g>`}
function stump(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-3.6 0V-4H3.6V0Q0 2 -3.6 0Z" fill="#6b4a2c"/><ellipse cx="0" cy="-4" rx="3.6" ry="1.5" fill="#c9a06a"/><ellipse cx="0" cy="-4" rx="2" ry=".8" fill="none" stroke="#8a6238" stroke-width=".5"/></g>`}
function logs(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-7" y="-3" width="12" height="3" rx="1.4" fill="#8a6238"/><rect x="-5" y="-6" width="12" height="3" rx="1.4" fill="#a37444"/><circle cx="6.8" cy="-4.5" r="1.4" fill="#d9b27c"/><circle cx="4.8" cy="-1.5" r="1.4" fill="#c9a06a"/></g>`}
function wald(st){
 const T=[[-18,-3,1],[-6,-7,1.1],[8,-4,1],[19,-8,.9],[2,2,.9]];
 const S=[[-18,-3],[-6,-7],[8,-4],[19,-8],[2,2]];
 let b='';   // ohne Wiesenfleck: der Boden kommt aus dem Spiel
 const trees=[5,4,3,1,0][st]; const order=[3,0,2,4,1];
 const keep=order.slice(5-trees).sort((a,c)=>T[a][1]-T[c][1]);
 // Stümpfe
 for(let i=0;i<5;i++) if(!keep.includes(i)) b+=stump(S[i][0],S[i][1]+3,1);
 for(const i of keep) b+=pine(T[i][0],T[i][1]+3,T[i][2]);
 if(st>=2) b+=logs(-22,6,.7); if(st>=3) b+=logs(14,6,.8);
 return svg('-32 -40 64 54',192,162,b);
}
function rock(x,y,s,c1,c2,c3){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-12 0L-14 -9L-6 -17L5 -18L13 -10L14 0Z" fill="${c1}"/><path d="M5 -18L13 -10L14 0L3 0L2 -9Z" fill="${c2}"/><path d="M-6 -17L5 -18L2 -11L-8 -9Z" fill="${c3}"/></g>`}
function fels(st){
 let b=`<ellipse cx="0" cy="0" rx="29" ry="9" fill="#6d6a5a"/><ellipse cx="-3" cy="-1" rx="21" ry="5" fill="#85806d" opacity=".8"/>`;
 const c=['#8f8a84','#66615b','#b8b2aa'];
 if(st===0) b+=rock(-14,2,.8,...c)+rock(14,3,.7,...c)+rock(0,0,1.5,...c);
 if(st===1) b+=rock(-14,2,.8,...c)+rock(14,3,.6,...c)+rock(0,0,1.2,...c)+`<path d="M-3 -14L1 -8L-2 -4" stroke="#3b3835" stroke-width="1" fill="none"/>`;
 if(st===2) b+=rock(-14,3,.6,...c)+rock(2,1,.95,...c)+rock(16,5,.4,...c);
 if(st===3) b+=rock(-4,2,.55,...c)+rock(12,5,.35,...c)+rock(-16,6,.3,...c);
 if(st===4) b+=`<ellipse cx="-8" cy="3" rx="3.2" ry="1.6" fill="#8f8a84"/><ellipse cx="6" cy="5" rx="2.4" ry="1.2" fill="#66615b"/><ellipse cx="14" cy="2" rx="2" ry="1" fill="#b8b2aa"/><ellipse cx="-16" cy="5" rx="1.8" ry=".9" fill="#8f8a84"/>`;
 if(st>=1&&st<4) b+=`<circle cx="${-18+st*3}" cy="7" r="1.2" fill="#c9c4bd"/><circle cx="${20-st*2}" cy="8" r="1" fill="#a8a29a"/>`;
 return svg('-32 -40 64 54',192,162,b);
}
function pond(cx,cy,rx,ry){return `<ellipse cx="${cx}" cy="${cy}" rx="${rx+3}" ry="${ry+1.8}" fill="#c9b27a"/><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#2f7fb3"/><ellipse cx="${cx-rx*.12}" cy="${cy-ry*.2}" rx="${rx*.68}" ry="${ry*.58}" fill="#4aa3d6"/>`}
function see(st){
 let b=`<ellipse cx="0" cy="1" rx="30" ry="10" fill="#5f6a38"/><ellipse cx="-3" cy="0" rx="22" ry="6" fill="#6d7a40" opacity=".7"/>`;
 const R='M-27 4C-18 -4 -12 6 -3 0S12 -5 18 2S27 3 29 -1';          // Flussverlauf
 const riv=(wid,col,extra='')=>`<path d="${R}" stroke="${col}" stroke-width="${wid}" fill="none" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
 if(st===0) b+=pond(-2,1,17,5.8)+`<ellipse cx="6" cy="1.5" rx="3" ry="1.1" fill="#3f9a4a"/>`;
 if(st===1) b+=pond(-9,1,13,4.6)+pond(17,2,6.5,2.5)+`<path d="M2 1.4Q9 2 12 2" stroke="#8a6c3a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-dasharray="1 2.6"/>`;
 if(st===2) b+=pond(-9,1,13,4.6)+pond(18,2,7.5,2.8)+`<path d="M3 1.4Q9 2 15 2" stroke="#c9b27a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M3 1.4Q8 2 11.5 2" stroke="#3f8fc4" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M-24 6Q-26 6 -27 5" stroke="#8a6c3a" stroke-width="2" stroke-dasharray="1 2.4" fill="none"/>`;
 if(st===3) b+=pond(-23,5,5.5,2.4)+riv(8.5,'#c9b27a').replace(R,'M-18 3C-14 -2 -12 4 -4 1S10 -3 18 2')+riv(5.5,'#2f7fb3').replace(R,'M-18 3C-14 -2 -12 4 -4 1S10 -3 18 2')+pond(-3,0.5,9,3.2)+pond(21,2,6.5,2.4)+`<path d="M-26 6C-23 5 -20 4 -18 3" stroke="#8a6c3a" stroke-width="2" stroke-dasharray="1 2.4" fill="none"/>`;
 if(st===4) b+=riv(10,'#c9b27a')+riv(7,'#2f7fb3')+riv(2.6,'#4aa3d6','opacity=".9"')+`<path d="M-14 1Q-12 -.4 -10 1M6 -2Q8 -3.4 10 -2M20 2Q22 .8 24 2" stroke="#dff6ff" stroke-width=".8" fill="none"/>`+`<ellipse cx="-3" cy="1" rx="6" ry="2.6" fill="#2f7fb3"/><ellipse cx="-3.5" cy="0.6" rx="4" ry="1.5" fill="#4aa3d6"/>`;
 for(const [x,h] of [[-27,11],[-24,15],[25,13],[28,16]]) b+=`<path d="M${x} 6V${-h}" stroke="#4a7a3a" stroke-width="1.2"/><ellipse cx="${x}" cy="${-h}" rx="1.3" ry="3" fill="#6b4a2c"/>`;
 return svg('-32 -30 64 44',192,132,b);
}
// ---------- Sheet ----------
const out=document.getElementById('out'); let h='';
const cell=(name,label,s)=>`<div class="sp" data-name="${name}">${s}<span>${label}</span></div>`;
const KS=['f','e','s','st'], SN={f:'Feuer',e:'Eis',s:'Schatten',st:'Stein'};
h+=`<h2>1 · Dorf: wächst von Tag zu Tag (7 Stufen, 1 Feld)</h2><p class="n">Stufe 0 = Bauplatz, 1 Zelt + Feuer, 2 Hütte, 3 Dorf mit Palisade und Wachturm, 4 erste Steinmauer mit Tor, 5 Burg mit Bergfried, 6 Ritterburg mit Zugbrücke und Wassergraben (Element-Graben: Lava, Eis, Schattennebel, Wasser). Der Stil folgt dem Element: Holzhütten, Iglus, schiefe Schattenhäuser, Steinhäuser.</p>`;
for(const k of KS){h+=`<div class="row"><div class="lab">${SN[k]}</div>`;for(let i=0;i<7;i++)h+=cell(`dorf-${k}-${i}`,`Stufe ${i}`,village(k,i));h+='</div>';}
h+=`<h2>2 · Arbeiter (Holzfäller, Bergarbeiter, Angler), je 2 Bilder pro Tätigkeit</h2><p class="n">Gewählt: jeweils Bild 1 (Holz 1, Berg 1, Angeln 1). Bild 2 bleibt als Reserve.</p>`;
for(const k of KS){h+=`<div class="row"><div class="lab">${SN[k]}</div>`;for(const j of [['holz','Holz'],['berg','Berg'],['fisch','Angeln']])for(let f=0;f<2;f++)h+=cell(`arbeiter-${k}-${j[0]}-${f}`,`${j[1]} ${f+1}`,worker(k,j[0],f));h+='</div>';}
h+=`<h2>3 · Biome in fünf Stufen (voll → abgebaut)</h2><p class="n">Wald (Bäume werden gefällt, Stümpfe und Holzstapel bleiben), Felsen (werden kleiner, am Ende Geröll), See (ersetzt den Sumpf; der Angler gräbt Gräben zu weiteren Teichen, am Ende entsteht ein kleiner Fluss).</p>`;
for(const [n,f,t] of [['wald',wald,'Wald'],['fels',fels,'Felsen'],['see',see,'See']]){h+=`<div class="row"><div class="lab">${t}</div>`;for(let i=0;i<5;i++)h+=cell(`biom-${n}-${i}`,(n==='see'?['See','Graben','Teiche verbunden','Kanal','Fluss'][i]:`${i*25}% abgebaut`),f(i));h+='</div>';}

// ---------- Welt um das Dorf ----------
const hs=(x,y,z=0)=>{let n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-Math.floor(n)};
const mix=(a,b,t)=>{const c=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=c(a),B=c(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const WORLD={
 f:{base:'#3b2a1c',hi:'#52361f',acc:'#ff8a3d',acc2:'#ffd27a',road:'#a2703f',roadE:'#5a3118'},
 e:{base:'#dcebf4',hi:'#f7fcff',acc:'#9bd7f2',acc2:'#ffffff',road:'#9db9c9',roadE:'#6f93a8'},
 s:{base:'#241a3d',hi:'#33265a',acc:'#a98bff',acc2:'#e0d4ff',road:'#4b3a7a',roadE:'#150e2b'},
 st:{base:'#6f6a60',hi:'#8d887c',acc:'#b8b2a6',acc2:'#d9cba6',road:'#b7a47c',roadE:'#6a5c3f'}};
const GRASS=['#2b4a2b','#2f5030'];
const MON=[[0,1],[3,1],[3,6],[9,6],[9,2],[11,2]];            // Monsterweg (Kacheln)
const TOW=[[10,3],[8,4],[7,5],[6,4],[4,3],[2,3]];             // Türme, nach Abstand zum Dorf
const VIL=[11,7];
const BIO=[['w',10,4],['w',10,5],['f',10,6],['s',7,3],['s',7,2],['w',5,4],['w',5,5],['w',4,5],['s',2,5],['f',1,4],['w',5,1],['w',6,1],['s',8,1]];
const STG=[
 {t:'Tag 1',v:0,R:0,np:0,pave:0},
 {t:'Tag 10',v:2,R:2.0,np:4,pave:0},
 {t:'Tag 22',v:4,R:3.6,np:5,pave:0},
 {t:'Tag 36',v:5,R:5.2,np:6,pave:1},
 {t:'Tag 42',v:6,R:7.5,np:6,pave:2}];
function welt(k,si){
 const W=WORLD[k],S=STG[si],T=40; let b='';
 const onMon=new Set();
 for(let i=0;i<MON.length-1;i++){const [x0,y0]=MON[i],[x1,y1]=MON[i+1];for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)onMon.add(x+','+y)}
 const cx=(VIL[0]+.5)*T,cy=(VIL[1]+.5)*T;
 const level=(x,y)=>{if(S.R<=0)return 0;const d=Math.hypot(x-VIL[0],(y-VIL[1])*1.15);return Math.max(0,Math.min(1,(S.R*1.6-d+(hs(x,y)-.5)*2.2)/1.4))};
 for(let y=0;y<8;y++)for(let x=0;x<12;x++){
  const mon=onMon.has(x+','+y),lv=mon?0:level(x,y),px=x*T,py=y*T;
  b+=`<rect x="${px}" y="${py}" width="${T}" height="${T}" fill="${mon?'#6b5233':GRASS[(x+y)&1]}"/>`;
  if(lv>0){ // Bodenwandel: weicher Fleck, wächst mit dem Wert
   const r=T*(.35+.4*lv);
   b+=`<ellipse cx="${px+T/2+(hs(x,y,1)-.5)*6}" cy="${py+T/2+(hs(x,y,2)-.5)*6}" rx="${r+4}" ry="${r+2}" fill="${mix(GRASS[0],W.base,.55)}" opacity="${.35+.4*lv}"/>`;
   if(lv>.55) b+=`<rect x="${px}" y="${py}" width="${T}" height="${T}" fill="${W.base}" opacity="${Math.min(1,(lv-.45)*1.9)}"/>`;
   const n=Math.round(lv*3);
   for(let i=0;i<n;i++){const ux=px+4+hs(x,y,i+3)*(T-8),uy=py+4+hs(x,y,i+9)*(T-8),q=hs(x,y,i+15);
    if(k==='f') b+= q<.4?`<path d="M${ux} ${uy}l5 -2l3 3l5 -1" stroke="${W.acc}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`:`<circle cx="${ux}" cy="${uy}" r="1.3" fill="${q<.7?W.acc2:W.acc}"/>`;
    if(k==='e') b+= q<.5?`<ellipse cx="${ux}" cy="${uy}" rx="6" ry="2.4" fill="${W.hi}"/>`:q<.8?`<path d="M${ux-3} ${uy}h6M${ux} ${uy-3}v6" stroke="${W.acc}" stroke-width="1"/>`:`<ellipse cx="${ux}" cy="${uy}" rx="5" ry="2" fill="${W.acc}" opacity=".6"/>`;
    if(k==='s') b+= q<.5?`<circle cx="${ux}" cy="${uy}" r="1.6" fill="${W.acc}" opacity=".8"/>`:`<path d="M${ux} ${uy}q4 -4 8 0q-3 2 -8 0" fill="${W.hi}"/>`;
    if(k==='st') b+= q<.6?`<ellipse cx="${ux}" cy="${uy}" rx="${2+q*3}" ry="${1.4+q*1.6}" fill="${q<.3?W.hi:W.acc}"/>`:`<path d="M${ux} ${uy}l5 -1l-1 4Z" fill="${W.acc2}" opacity=".7"/>`;
   }
  }
 }
 // Biome (bleiben im umgewandelten Boden sichtbar)
 for(const [t,x,y] of BIO){const px=x*T,py=y*T;
  if(t==='w'){for(const [ox,oy,sc] of [[10,26,1],[26,18,1.1],[18,34,.9],[30,32,.8]]){const X=px+ox,Y=py+oy;b+=`<ellipse cx="${X}" cy="${Y+1}" rx="${6*sc}" ry="2" fill="#0005"/><path d="M${X} ${Y-15*sc}L${X-6*sc} ${Y-3*sc}H${X+6*sc}Z" fill="#2f7a3c"/><path d="M${X} ${Y-9*sc}L${X-7*sc} ${Y+1}H${X+7*sc}Z" fill="#3a8c46"/><path d="M${X} ${Y-15*sc}V${Y-3}" stroke="#25602e" stroke-width="0"/>`}}
  if(t==='s')b+=`<ellipse cx="${px+20}" cy="${py+21}" rx="19" ry="16" fill="#2a6a96"/><ellipse cx="${px+19}" cy="${py+19}" rx="15" ry="12" fill="#3484b8"/><ellipse cx="${px+14}" cy="${py+14}" rx="6" ry="3" fill="#5fb0dc"/>`;
  if(t==='f')b+=`<ellipse cx="${px+20}" cy="${py+33}" rx="15" ry="4" fill="#0005"/><path d="M${px+6} ${py+33}L${px+9} ${py+14}L${px+19} ${py+6}L${px+31} ${py+13}L${px+35} ${py+33}Z" fill="#8f8b84"/><path d="M${px+19} ${py+6}L${px+31} ${py+13}L${px+35} ${py+33}H${px+22}Z" fill="#6f6b65"/>`;
 }
 // Wege Dorf → Türme: um Biome herum, geschwungen, wachsen als Astwerk (Start = Dorf oder nächstes Wegstück)
 const R=W.road,E=W.roadE,pw=(x,y)=>[(x+.5)*T,(y+.5)*T];
 const blocked=new Set(BIO.map(([t,x,y])=>x+','+y)),towSet=new Set(TOW.map(t=>t.join(',')));
 const have=[VIL.join(',')],segs=[];
 for(let i=0;i<6;i++){const tgt=TOW[i].join(',');
  const dist={},prev={},q=[];for(const k0 of have){dist[k0]=0;q.push(k0)}
  while(q.length){q.sort((u,v)=>dist[u]-dist[v]);const c=q.shift();if(c===tgt)break;const [cx0,cy0]=c.split(',').map(Number);
   for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if(!dx&&!dy)continue;const nx=cx0+dx,ny=cy0+dy,nk=nx+','+ny;if(nx<0||ny<0||nx>11||ny>7)continue;
    if(blocked.has(nk)||(towSet.has(nk)&&nk!==tgt))continue;if(dx&&dy&&(blocked.has((cx0+dx)+','+cy0)||blocked.has(cx0+','+(cy0+dy))))continue;
    const w=(dx&&dy?1.45:1)*(onMon.has(nk)?4:1)+hs(nx,ny,5)*.5,nd=dist[c]+w;if(dist[nk]===undefined||nd<dist[nk]-1e-9){dist[nk]=nd;prev[nk]=c;if(!q.includes(nk))q.push(nk)}}}
  const pts=[];let c=tgt;while(c&&!have.includes(c)){pts.unshift(c);c=prev[c]}pts.unshift(c);
  for(const k0 of pts)if(!have.includes(k0))have.push(k0);segs.push(pts);}
 const curve=(pts,i)=>{const P=pts.map((k0,j)=>{const [x,y]=k0.split(',').map(Number),[px,py]=pw(x,y);return j===0||j===pts.length-1?[px,py]:[px+(hs(x,y,7+i)-.5)*12,py+(hs(x,y,8+i)-.5)*12]});
  if(P.length<2)return '';let d=`M${P[0][0]} ${P[0][1]}`;
  for(let j=0;j<P.length-1;j++){const p0=P[Math.max(0,j-1)],p1=P[j],p2=P[j+1],p3=P[Math.min(P.length-1,j+2)];
   d+=`C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`}return d};
 for(let i=0;i<S.np;i++){const d=curve(segs[i],i);if(!d)continue;
  if(S.pave===2) b+=`<path d="${d}" stroke="${E}" stroke-width="17" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" stroke="${R}" stroke-width="13" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" stroke="${E}" stroke-width="13" fill="none" stroke-dasharray="1.5 7.5" opacity=".55"/>`;
  else if(S.pave===1) b+=`<path d="${d}" stroke="${E}" stroke-width="13" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" stroke="${R}" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  else b+=`<path d="${d}" stroke="${R}" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>`;
 }
 // Türme
 for(let i=0;i<TOW.length;i++){const [tx,ty]=pw(...TOW[i]),a=W.acc;b+=`<ellipse cx="${tx}" cy="${ty+11}" rx="9" ry="3" fill="#0006"/><rect x="${tx-6}" y="${ty-8}" width="12" height="18" fill="#8a8f98"/><rect x="${tx}" y="${ty-8}" width="6" height="18" fill="#6b7078"/><path d="M${tx-9} ${ty-7}L${tx} ${ty-18}L${tx+9} ${ty-7}Z" fill="${k==='e'?'#79c6ee':k==='s'?'#7a4be0':k==='f'?'#e8590c':'#a4753e'}"/>`}
 // Dorf (1 Feld)
 const v=village(k,S.v).replace(/width="216" height="228"/,'width="46" height="48.5"').replace('<svg ','<svg x="'+(cx-27)+'" y="'+(cy-32)+'" ');
 b+=v;
 b+=`<text x="8" y="16" font-size="13" font-weight="700" fill="${k==='e'?'#2f5a78':'#fff'}" stroke="${k==='e'?'#fff':'#000'}" stroke-width=".4">${S.t}</text>`;
 return svg('0 0 480 320',480,320,b);
}
h+=`<h2>4 · Welt um das Dorf: Boden wandelt sich, Wege wachsen (Vorschlag 27.10.)</h2><p class="n">Ausschnitt 12 × 8 Felder, Dorf in der Ecke unten rechts (Wege biegen um Wald, Felsen und See und kreuzen den Monsterweg nur, wo es sein muss). Braun = Monsterweg (bleibt unverändert, immer gut erkennbar). Vom Dorf aus wächst der Boden in Ringen zum Element um (Asche, Schnee, Violett, Geröll), unregelmäßig, nicht kreisrund. Wege: Tag 10 Trampelpfade zu 4 Türmen, Tag 22 zu 5, Tag 36 gepflasterte Straße zu allen 6, Tag 42 Straße mit Rand zu allen.</p>`;
for(const k of KS){h+=`<div class="row"><div class="lab">${SN[k]}</div>`;for(let i=0;i<5;i++)h+=cell(`welt-${k}-${i}`,STG[i].t,welt(k,i));h+='</div>';}

out.innerHTML=h;
</script>
